o localmente (sem proxy para ui5.sap.com nem backend) e cobertura medida apenas no código da app.", "en": "At the project root, create a configuration used only for tests: UI5 1.153.0 served locally (no proxy to ui5.sap.com, no backend) and coverage measured on app code only.", "fr": "À la racine du projet, créez une configuration réservée aux tests : UI5 1.153.0 servi localement (sans proxy vers ui5.sap.com ni backend) et couverture mesurée uniquement sur le code de l’application."}, "files": ["ui5-test.yaml"], "code": [["p-ui5-test-yaml", "yaml", "ui5-test.yaml", "ui5-test.yaml"]], "note": {"pt": "<b>Porquê um ficheiro à parte?</b> O <code>ui5.yaml</code> gerado vai buscar o UI5 a ui5.sap.com sem versão fixa e encaminha <code>/V2</code> para o Northwind real. Para testes queremos sempre a mesma versão e nenhum backend.", "en": "<b>Why a separate file?</b> The generated <code>ui5.yaml</code> loads UI5 from ui5.sap.com without a fixed version and forwards <code>/V2</code> to the real Northwind. Tests need the same version every time and no backend.", "fr": "<b>Pourquoi un fichier séparé ?</b> Le <code>ui5.yaml</code> généré charge UI5 depuis ui5.sap.com sans version fixe et redirige <code>/V2</code> vers le vrai Northwind. Les tests ont besoin de la même version à chaque fois et d’aucun backend."}}, {"t": {"pt": "Configurar os scripts npm", "en": "Configure the npm scripts", "fr": "Configurer les scripts npm"}, "p": {"pt": "Substitua o <code>package.json</code> pelo do projeto. Os scripts <code>test</code>, <code>test:unit</code> e <code>test:integration</code> abrem o browser; <code>test:ci</code> corre tudo headless com cobertura.", "en": "Replace <code>package.json</code> with the project’s. The <code>test</code>, <code>test:unit</code> and <code>test:integration</code> scripts open the browser; <code>test:ci</code> runs everything headless with coverage.", "fr": "Remplacez <code>package.json</code> par celui du projet. Les scripts <code>test</code>, <code>test:unit</code> et <code>test:integration</code> ouvrent le navigateur ; <code>test:ci</code> exécute tout en headless avec couverture."}, "files": ["package.json"], "code": [["p-package-json", "json", "package.json", "package.json"]], "note": {"pt": "<b>No BAS</b>, o <code>--open</code> não abre o browser sozinho: quando aparecer a notificação da porta 8080, clique em <i>Open in New Tab</i> e acrescente <code>/test/testsuite.qunit.html</code> ao endereço.", "en": "<b>In BAS</b>, <code>--open</code> does not open the browser by itself: when the port 8080 notification appears, click <i>Open in New Tab</i> and append <code>/test/testsuite.qunit.html</code> to the address.", "fr": "<b>Dans BAS</b>, <code>--open</code> n’ouvre pas le navigateur seul : quand la notification du port 8080 apparaît, cliquez sur <i>Open in New Tab</i> et ajoutez <code>/test/testsuite.qunit.html</code> à l’adresse."}}, {"t": {"pt": "Ajustar as configurações geradas", "en": "Adjust the generated configurations", "fr": "Ajuster les configurations générées"}, "p": {"pt": "No <code>ui5-mock.yaml</code>, apague o bloco <code>test:</code> do <code>fiori-tools-preview</code> (gerava páginas que ignoravam parte dos testes) e aponte o <code>mockdataPath</code> para <code>./webapp/localService/mockdata</code>. Faça a mesma correção do <code>mockdataPath</code> no <code>ui5-local.yaml</code>.", "en": "In <code>ui5-mock.yaml</code>, delete the <code>test:</code> block of <code>fiori-tools-preview</code> (it generated pages that skipped part of the tests) and point <code>mockdataPath</code> to <code>./webapp/localService/mockdata</code>. Apply the same <code>mockdataPath</code> fix in <code>ui5-local.yaml</code>.", "fr": "Dans <code>ui5-mock.yaml</code>, supprimez le bloc <code>test:</code> de <code>fiori-tools-preview</code> (il générait des pages qui ignoraient une partie des tests) et pointez <code>mockdataPath</code> vers <code>./webapp/localService/mockdata</code>. Appliquez la même correction de <code>mockdataPath</code> dans <code>ui5-local.yaml</code>."}, "files": ["ui5-mock.yaml", "ui5-local.yaml", "ui5.yaml"], "code": [["p-ui5-mock-yaml", "yaml", "ui5-mock.yaml", "ui5-mock.yaml"], ["p-ui5-local-yaml", "yaml", "ui5-local.yaml", "ui5-local.yaml"], ["p-ui5-yaml", "yaml", "ui5.yaml (unchanged)", "ui5.yaml"]]}, {"t": {"pt": "Escrever o código da aplicação", "en": "Write the application code", "fr": "Écrire le code de l’application"}, "p": {"pt": "Substitua os ficheiros gerados pelos do projeto (e apague <code>View1</code> se o gerador o criou). É este o código que os testes vão verificar: uma worklist de encomendas com pesquisa, ordenação e navegação para o detalhe.", "en": "Replace the generated files with the project’s (and delete <code>View1</code> if the generator created it). This is the code the tests will check: an orders worklist with search, sort and navigation to the detail.", "fr": "Remplacez les fichiers générés par ceux du projet (et supprimez <code>View1</code> si le générateur l’a créé). C’est le code que les tests vont vérifier : une worklist de commandes avec recherche, tri et navigation vers le détail."}, "files": ["webapp/manifest.json", "webapp/Component.js", "webapp/i18n/i18n.properties", "webapp/model/*", "webapp/controller/*", "webapp/view/*"], "code": [["p-webapp-manifest-json", "json", "manifest.json", "webapp/manifest.json"], ["p-webapp-Component-js", "javascript", "Component.js", "webapp/Component.js"], ["p-webapp-i18n-i18n-properties", "properties", "i18n.properties", "webapp/i18n/i18n.properties"], ["p-webapp-model-formatter-js", "javascript", "model/formatter.js", "webapp/model/formatter.js"], ["p-webapp-model-models-js", "javascript", "model/models.js", "webapp/model/models.js"], ["p-webapp-controller-BaseController-js", "javascript", "controller/BaseController.js", "webapp/controller/BaseController.js"], ["p-webapp-controller-App-controller-js", "javascript", "controller/App.controller.js", "webapp/controller/App.controller.js"], ["p-webapp-controller-Worklist-controller-js", "javascript", "controller/Worklist.controller.js", "webapp/controller/Worklist.controller.js"], ["p-webapp-controller-Detail-controller-js", "javascript", "controller/Detail.controller.js", "webapp/controller/Detail.controller.js"], ["p-webapp-view-App-view-xml", "markup", "view/App.view.xml", "webapp/view/App.view.xml"], ["p-webapp-view-Worklist-view-xml", "markup", "view/Worklist.view.xml", "webapp/view/Worklist.view.xml"], ["p-webapp-view-Detail-view-xml", "markup", "view/Detail.view.xml", "webapp/view/Detail.view.xml"]], "note": {"pt": "<b>Desenhado para ser testável.</b> <code>onRefresh</code> e <code>_onBindingChange</code> devolvem a sua Promise, e os textos passam por <code>_loadResourceBundle</code>. Sem isso, os testes teriam de adivinhar quando o código terminou.", "en": "<b>Designed to be testable.</b> <code>onRefresh</code> and <code>_onBindingChange</code> return their Promise, and texts go through <code>_loadResourceBundle</code>. Without that, tests would have to guess when the code finished.", "fr": "<b>Conçu pour être testable.</b> <code>onRefresh</code> et <code>_onBindingChange</code> retournent leur Promise, et les textes passent par <code>_loadResourceBundle</code>. Sinon, les tests devraient deviner quand le code s’est terminé."}}, {"t": {"pt": "Preparar os dados simulados", "en": "Prepare the mock data", "fr": "Préparer les données simulées"}, "p": {"pt": "O gerador já guardou o metadata em <code>localService/mainService/metadata.xml</code>; o manifest e o mock server leem-no daí. Falta criar os ficheiros de dados e o <code>mockserver.js</code>, que simula o serviço OData V2 no browser e só é usado pelos testes OPA5.", "en": "The generator already saved the metadata in <code>localService/mainService/metadata.xml</code>; the manifest and the mock server read it from there. What remains is the data files and <code>mockserver.js</code>, which simulates the OData V2 service in the browser and is used only by the OPA5 tests.", "fr": "Le générateur a déjà enregistré le metadata dans <code>localService/mainService/metadata.xml</code> ; le manifest et le mock server le lisent à cet endroit. Il reste à créer les fichiers de données et <code>mockserver.js</code>, qui simule le service OData V2 dans le navigateur et n’est utilisé que par les tests OPA5."}, "files": ["webapp/localService/mainService/metadata.xml", "webapp/localService/mockdata/*", "webapp/localService/mockserver.js"], "code": [["x-metadata", "bash", "terminal", "terminal"], ["p-webapp-localService-mockserver-js", "javascript", "localService/mockserver.js", "webapp/localService/mockserver.js"], ["p-webapp-localService-mockdata-Orders-json", "json", "mockdata/Orders.json", "webapp/localService/mockdata/Orders.json"], ["p-webapp-localService-mockdata-Order-Details-json", "json", "mockdata/Order_Details.json", "webapp/localService/mockdata/Order_Details.json"]], "note": {"pt": "<b>Tabela vazia no OPA5 (“Worklist table has orders” falha)?</b> O mock server não encontrou o metadata. Confirme: 1) que existe <code>webapp/localService/mainService/metadata.xml</code>; 2) que usa esta versão do <code>mockserver.js</code>, que resolve os caminhos a partir do próprio ficheiro e funciona com qualquer namespace; 3) que o <code>mainService</code> no manifest tem <code>uri</code> <code>/V2/Northwind/Northwind.svc/</code> e <code>localUri</code> <code>localService/mainService/metadata.xml</code>. No separador Network do browser, <code>metadata.xml</code> tem de responder 200.", "en": "<b>Empty table in OPA5 (“Worklist table has orders” fails)?</b> The mock server did not find the metadata. Check: 1) that <code>webapp/localService/mainService/metadata.xml</code> exists; 2) that you use this version of <code>mockserver.js</code>, which resolves paths from its own location and works with any namespace; 3) that <code>mainService</code> in the manifest has <code>uri</code> <code>/V2/Northwind/Northwind.svc/</code> and <code>localUri</code> <code>localService/mainService/metadata.xml</code>. In the browser’s Network tab, <code>metadata.xml</code> must answer 200.", "fr": "<b>Tableau vide dans OPA5 (« Worklist table has orders » échoue) ?</b> Le mock server n’a pas trouvé le metadata. Vérifiez : 1) que <code>webapp/localService/mainService/metadata.xml</code> existe ; 2) que vous utilisez cette version de <code>mockserver.js</code>, qui résout les chemins à partir de son propre emplacement et fonctionne avec n’importe quel espace de noms ; 3) que <code>mainService</code> dans le manifest a l’<code>uri</code> <code>/V2/Northwind/Northwind.svc/</code> et le <code>localUri</code> <code>localService/mainService/metadata.xml</code>. Dans l’onglet Network du navigateur, <code>metadata.xml</code> doit répondre 200."}}, {"t": {"pt": "Configurar o Test Starter", "en": "Configure the Test Starter", "fr": "Configurer le Test Starter"}, "p": {"pt": "Três ficheiros em <code>webapp/test</code>: a página de entrada da suite, a página genérica que corre cada teste e a configuração central (versões do QUnit e do Sinon, tema, língua, cobertura e lista de testes).", "en": "Three files in <code>webapp/test</code>: the suite entry page, the generic page that runs each test, and the central configuration (QUnit and Sinon versions, theme, language, coverage and test list).", "fr": "Trois fichiers dans <code>webapp/test</code> : la page d’entrée de la suite, la page générique qui exécute chaque test et la configuration centrale (versions de QUnit et Sinon, thème, langue, couverture et liste des tests)."}, "files": ["webapp/test/testsuite.qunit.html", "webapp/test/Test.qunit.html", "webapp/test/testsuite.qunit.js"], "code": [["x-folders", "bash", "terminal", "terminal"], ["p-webapp-test-testsuite-qunit-html", "markup", "testsuite.qunit.html", "webapp/test/testsuite.qunit.html"], ["p-webapp-test-Test-qunit-html", "markup", "Test.qunit.html", "webapp/test/Test.qunit.html"], ["p-webapp-test-testsuite-qunit-js", "javascript", "testsuite.qunit.js", "webapp/test/testsuite.qunit.js"]], "note": {"pt": "<b>Versões reais.</b> <code>qunit: { version: 2 }</code> carrega o QUnit 2.3.2 e <code>sinon: { version: 4 }</code> o Sinon 4.4.6. Por isso <code>QUnit.test.each</code> e <code>assert.rejects</code> não existem neste projeto.", "en": "<b>Actual versions.</b> <code>qunit: { version: 2 }</code> loads QUnit 2.3.2 and <code>sinon: { version: 4 }</code> loads Sinon 4.4.6. That is why <code>QUnit.test.each</code> and <code>assert.rejects</code> do not exist in this project.", "fr": "<b>Versions réelles.</b> <code>qunit: { version: 2 }</code> charge QUnit 2.3.2 et <code>sinon: { version: 4 }</code> Sinon 4.4.6. C’est pourquoi <code>QUnit.test.each</code> et <code>assert.rejects</code> n’existent pas dans ce projet."}}, {"t": {"pt": "Agregar os testes unitários", "en": "Aggregate the unit tests", "fr": "Agréger les tests unitaires"}, "p": {"pt": "Corresponde à entrada <code>\"unit/unitTests\"</code> da suite. Cada ficheiro de teste novo tem de ser acrescentado aqui, senão nunca corre.", "en": "Matches the <code>\"unit/unitTests\"</code> suite entry. Every new test file must be added here, or it never runs.", "fr": "Correspond à l’entrée <code>\"unit/unitTests\"</code> de la suite. Chaque nouveau fichier de test doit être ajouté ici, sinon il ne s’exécute jamais."}, "files": ["webapp/test/unit/unitTests.qunit.js"], "code": [["p-webapp-test-unit-unitTests-qunit-js", "javascript", "unit/unitTests.qunit.js", "webapp/test/unit/unitTests.qunit.js"]]}, {"t": {"pt": "Testar o formatter", "en": "Test the formatter", "fr": "Tester le formatter"}, "p": {"pt": "Funções puras, o melhor ponto de partida. Repare no <code>testEach</code>: substitui o <code>QUnit.test.each</code> e gera um teste por linha. As datas são objetos <code>Date</code>, como o modelo OData V2 as entrega.", "en": "Pure functions, the best place to start. Note <code>testEach</code>: it replaces <code>QUnit.test.each</code> and creates one test per row. Dates are <code>Date</code> objects, as the OData V2 model delivers them.", "fr": "Des fonctions pures, le meilleur point de départ. Notez <code>testEach</code> : il remplace <code>QUnit.test.each</code> et crée un test par ligne. Les dates sont des objets <code>Date</code>, comme le modèle OData V2 les fournit."}, "files": ["webapp/test/unit/model/formatter.js"], "code": [["p-webapp-test-unit-model-formatter-js", "javascript", "unit/model/formatter.js", "webapp/test/unit/model/formatter.js"]]}, {"t": {"pt": "Testar o models.js", "en": "Test models.js", "fr": "Tester models.js"}, "p": {"pt": "Verifica os valores por defeito do modelo da view, a fusão de valores próprios e que cada chamada devolve uma instância independente. Cada modelo criado é destruído no fim.", "en": "Checks the view model defaults, the merge of custom values and that each call returns an independent instance. Every model created is destroyed at the end.", "fr": "Vérifie les valeurs par défaut du modèle de vue, la fusion des valeurs propres et que chaque appel retourne une instance indépendante. Chaque modèle créé est détruit à la fin."}, "files": ["webapp/test/unit/model/models.js"], "code": [["p-webapp-test-unit-model-models-js", "javascript", "unit/model/models.js", "webapp/test/unit/model/models.js"]]}, {"t": {"pt": "Testar o BaseController", "en": "Test the BaseController", "fr": "Tester le BaseController"}, "p": {"pt": "Primeiros stubs: <code>UIComponent.getRouterFor</code>, <code>History.getInstance</code> e <code>window.history.go</code>. Os dois ramos do <code>onNavBack</code> e a cache do i18n ficam cobertos.", "en": "First stubs: <code>UIComponent.getRouterFor</code>, <code>History.getInstance</code> and <code>window.history.go</code>. Both <code>onNavBack</code> branches and the i18n cache are covered.", "fr": "Premiers stubs : <code>UIComponent.getRouterFor</code>, <code>History.getInstance</code> et <code>window.history.go</code>. Les deux branches de <code>onNavBack</code> et le cache i18n sont couverts."}, "files": ["webapp/test/unit/controller/BaseController.js"], "code": [["p-webapp-test-unit-controller-BaseController-js", "javascript", "unit/controller/BaseController.js", "webapp/test/unit/controller/BaseController.js"]]}, {"t": {"pt": "Testar o App.controller", "en": "Test App.controller", "fr": "Tester App.controller"}, "p": {"pt": "Controller instanciado sem view: <code>getView</code> e <code>getOwnerComponent</code> são stubs. Confirma a classe de densidade, o modelo <code>appView</code> e o carregamento do i18n.", "en": "Controller created without a view: <code>getView</code> and <code>getOwnerComponent</code> are stubs. Checks the density class, the <code>appView</code> model and the i18n load.", "fr": "Contrôleur instancié sans vue : <code>getView</code> et <code>getOwnerComponent</code> sont des stubs. Vérifie la classe de densité, le modèle <code>appView</code> et le chargement de l’i18n."}, "files": ["webapp/test/unit/controller/App.controller.js"], "code": [["p-webapp-test-unit-controller-App-controller-js", "javascript", "unit/controller/App.controller.js", "webapp/test/unit/controller/App.controller.js"]]}, {"t": {"pt": "Testar o Worklist.controller", "en": "Test Worklist.controller", "fr": "Tester Worklist.controller"}, "p": {"pt": "O teste mais completo: fake timers para a pesquisa com espera de 300 ms, inspeção dos filtros (<code>Contains</code> por texto, <code>EQ</code> no <code>OrderID</code>), ordenação, refresh com toast, navegação e contador. As funções <code>arrange</code> e <code>cleanUp</code> partilham a preparação entre módulos.", "en": "The most complete test: fake timers for the 300 ms debounced search, filter inspection (<code>Contains</code> on text, <code>EQ</code> on <code>OrderID</code>), sorting, refresh with toast, navigation and counter. The <code>arrange</code> and <code>cleanUp</code> functions share the setup between modules.", "fr": "Le test le plus complet : fake timers pour la recherche différée de 300 ms, inspection des filtres (<code>Contains</code> sur le texte, <code>EQ</code> sur <code>OrderID</code>), tri, rafraîchissement avec toast, navigation et compteur. Les fonctions <code>arrange</code> et <code>cleanUp</code> partagent la préparation entre modules."}, "files": ["webapp/test/unit/controller/Worklist.controller.js"], "code": [["p-webapp-test-unit-controller-Worklist-controller-js", "javascript", "unit/controller/Worklist.controller.js", "webapp/test/unit/controller/Worklist.controller.js"]]}, {"t": {"pt": "Testar o Detail.controller", "en": "Test Detail.controller", "fr": "Tester Detail.controller"}, "p": {"pt": "Testa a ligação OData V2 sem backend: o stub de <code>bindElement</code> guarda os parâmetros, e o teste chama diretamente os eventos <code>dataRequested</code> e <code>dataReceived</code>. Cobre também a encomenda inexistente, com <code>MessageBox.error</code> em stub.", "en": "Tests the OData V2 binding with no backend: the <code>bindElement</code> stub keeps the parameters, and the test calls the <code>dataRequested</code> and <code>dataReceived</code> events directly. It also covers the missing order, with <code>MessageBox.error</code> stubbed.", "fr": "Teste la liaison OData V2 sans backend : le stub de <code>bindElement</code> conserve les paramètres et le test appelle directement les événements <code>dataRequested</code> et <code>dataReceived</code>. Il couvre aussi la commande inexistante, avec <code>MessageBox.error</code> en stub."}, "files": ["webapp/test/unit/controller/Detail.controller.js"], "code": [["p-webapp-test-unit-controller-Detail-controller-js", "javascript", "unit/controller/Detail.controller.js", "webapp/test/unit/controller/Detail.controller.js"]]}, {"t": {"pt": "Escrever as jornadas OPA5", "en": "Write the OPA5 journeys", "fr": "Écrire les parcours OPA5"}, "p": {"pt": "Testes de integração da app inteira com dados simulados. O <code>Startup.js</code> liga o mock server antes do componente: sem isso, a app tenta o Northwind real e os testes falham.", "en": "Integration tests of the whole app with mock data. <code>Startup.js</code> starts the mock server before the component: without it, the app calls the real Northwind and the tests fail.", "fr": "Tests d’intégration de toute l’application avec données simulées. <code>Startup.js</code> démarre le mock server avant le composant : sans cela, l’application appelle le vrai Northwind et les tests échouent."}, "files": ["webapp/test/integration/*"], "code": [["p-webapp-test-integration-opaTests-qunit-js", "javascript", "integration/opaTests.qunit.js", "webapp/test/integration/opaTests.qunit.js"], ["p-webapp-test-integration-NavigationJourney-js", "javascript", "integration/NavigationJourney.js", "webapp/test/integration/NavigationJourney.js"], ["p-webapp-test-integration-arrangements-Startup-js", "javascript", "arrangements/Startup.js", "webapp/test/integration/arrangements/Startup.js"], ["p-webapp-test-integration-pages-Worklist-js", "javascript", "pages/Worklist.js", "webapp/test/integration/pages/Worklist.js"], ["p-webapp-test-integration-pages-Detail-js", "javascript", "pages/Detail.js", "webapp/test/integration/pages/Detail.js"]]}, {"t": {"pt": "Lint e ficheiros ignorados", "en": "Lint and ignored files", "fr": "Lint et fichiers ignorés"}, "p": {"pt": "Declare <code>Promise</code> como global no ESLint e acrescente as pastas de relatórios ao <code>.gitignore</code>.", "en": "Declare <code>Promise</code> as a global in ESLint and add the report folders to <code>.gitignore</code>.", "fr": "Déclarez <code>Promise</code> comme globale dans ESLint et ajoutez les dossiers de rapports au <code>.gitignore</code>."}, "files": ["eslint.config.mjs", ".gitignore"], "code": [["p-eslint-config-mjs", "javascript", "eslint.config.mjs", "eslint.config.mjs"], ["p-gitignore", "none", ".gitignore", ".gitignore"]]}, {"t": {"pt": "Executar e conferir o resultado", "en": "Run and check the result", "fr": "Exécuter et vérifier le résultat"}, "p": {"pt": "Corra a suite no browser e depois headless. O resultado tem de ser igual ao de baixo: 51 testes unitários e 3 jornadas OPA5 a verde, com 98% de linhas cobertas.", "en": "Run the suite in the browser, then headless. The result must match the one below: 51 unit tests and 3 OPA5 journeys green, with 98% of lines covered.", "fr": "Exécutez la suite dans le navigateur, puis en headless. Le résultat doit correspondre à celui ci-dessous : 51 tests unitaires et 3 parcours OPA5 au vert, avec 98 % des lignes couvertes."}, "files": ["report/", "coverage/lcov.info"], "code": [["x-run", "bash", "terminal", "terminal"], ["x-expected", "none", "npm run test:ci", "npm run test:ci"]], "note": {"pt": "<b>Se o test:ci falhar no BAS</b> ao arrancar o browser, é o Chrome do puppeteer a pedir bibliotecas de sistema. Use <code>npm test</code> no browser durante o curso; o <code>test:ci</code> destina-se ao pipeline.", "en": "<b>If test:ci fails in BAS</b> while launching the browser, puppeteer’s Chrome is missing system libraries. Use <code>npm test</code> in the browser during the training; <code>test:ci</code> is meant for the pipeline.", "fr": "<b>Si test:ci échoue dans BAS</b> au lancement du navigateur, il manque des bibliothèques système au Chrome de puppeteer. Utilisez <code>npm test</code> dans le navigateur pendant la formation ; <code>test:ci</code> est destiné au pipeline."}}, {"t": {"pt": "Replicar: criar um novo teste", "en": "Replicate: create a new test", "fr": "Reproduire : créer un nouveau test"}, "p": {"pt": "Para cada controller ou função nova: 1) crie o teste no mesmo caminho relativo em <code>webapp/test/unit</code>; 2) parta deste modelo; 3) acrescente-o ao <code>unitTests.qunit.js</code>; 4) corra <code>npm run test:unit</code>; 5) confirme a cobertura com <code>npm run test:ci</code>.", "en": "For every new controller or function: 1) create the test on the same relative path in <code>webapp/test/unit</code>; 2) start from this template; 3) add it to <code>unitTests.qunit.js</code>; 4) run <code>npm run test:unit</code>; 5) check coverage with <code>npm run test:ci</code>.", "fr": "Pour chaque nouveau contrôleur ou fonction : 1) créez le test au même chemin relatif dans <code>webapp/test/unit</code> ; 2) partez de ce modèle ; 3) ajoutez-le à <code>unitTests.qunit.js</code> ; 4) lancez <code>npm run test:unit</code> ; 5) vérifiez la couverture avec <code>npm run test:ci</code>."}, "files": ["webapp/test/unit/controller/MyNew.controller.js"], "code": [["x-template", "javascript", "unit/controller/MyNew.controller.js", "unit/controller/MyNew.controller.js"]]}];

<script>
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  };
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const src = (id) => document.getElementById(id).value;

  /* Collection (visual theme): set before the canvas scripts boot */
  const root = document.documentElement;
  let collection = store.get("atelier.collection");
  if (!["jardin", "calibre"].includes(collection)) collection = "jardin";
  root.dataset.collection = collection;

  let lang = store.get("atelier.lang");
  if (!["pt", "en", "fr"].includes(lang)) lang = "en";
  const L = (o) => (o && (o[lang] || o.en)) || "";

  function highlight(code, grammar) {
    const P = window.Prism;
    if (P && P.languages[grammar]) return P.highlight(code, P.languages[grammar], grammar);
    return esc(code);
  }
  function plate(id, grammar, label) {
    return `<div class="plate"><div class="plate-head"><span>${esc(label)}</span>` +
      `<button type="button" class="copy" data-copy="${id}">${L(UI.copy)}</button></div>` +
      `<pre><code>${highlight(src(id), grammar)}</code></pre></div>`;
  }

  /* ── Static strings ── */
  function renderStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach((el) => { el.innerHTML = L(UI[el.dataset.i + "@" + collection] || UI[el.dataset.i]); });
    document.querySelectorAll("[data-collection-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.collectionSet === collection)));
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }

  /* ── Chapter index ── */
  function renderIndex() {
    $("#index").innerHTML = NAV.map((n) => `<li><a href="#${n.id}" data-sec="${n.id}"><i>${n.n}</i><span>${L(n.t)}</span></a></li>`).join("");
  }

  /* ── I ── */
  function renderIntro() {
    // top-down, same order as the pyramid bands (E2E, OPA5, unit)
    $("#tiers").innerHTML = TIERS.slice().reverse().map((t) => `<div class="tier"><b>${t.n}</b><div><h4>${L(t.h)}</h4><p>${L(t.p)}</p></div></div>`).join("");
    $("#register").innerHTML = REGISTER.map((r) => `<div class="register-row"><dt>${r.k}</dt><dd>${L(r.d)}</dd></div>`).join("");
  }

  /* ── II ── */
  function renderConcepts() {
    $("#concepts-grid").innerHTML = CONCEPTS.map((c) => `<article class="concept"><span class="k">${c.k}</span><h3>${L(c.t)}</h3><p>${L(c.p)}</p></article>`).join("");
  }

  /* ── III · Anatomy (real project tree) ── */
  const roman = (n) => [["X", 10], ["IX", 9], ["V", 5], ["IV", 4], ["I", 1]].reduce((acc, [r, v]) => { while (n >= v) { acc += r; n -= v; } return acc; }, "");
  const FIRST_FILE = FILES.find((x) => x.path === "orders/webapp/test/unit/controller/Worklist.controller.js") || FILES.find((x) => x.code);
  let selected = store.get("atelier.file2");
  if (!FILES.some((x) => x.code && x.path === selected)) selected = FIRST_FILE.path;
  // folders: collapsed by default, except the ones leading to the selected file
  const ancOf = (path) => (FILES.find((x) => x.path === path) || {}).anc || [];
  let open;
  try { open = new Set(JSON.parse(store.get("atelier.open") || "null")); } catch (e) { open = null; }
  if (!open || !open.size) open = new Set(["", "webapp", ...ancOf(selected)]);
  const saveOpen = () => store.set("atelier.open", JSON.stringify([...open]));
  function renderTree() {
    const rows = FILES.filter((f) => f.anc.every((a) => open.has(a))).map((f) => {
      if (f.dir) {
        const isOpen = open.has(f.dpath);
        if (f.root) return `<span class="dir root">${esc(f.dir)}</span>`;
        return `<button type="button" class="dir" data-dir="${esc(f.dpath)}" aria-expanded="${isOpen}">` +
          `${esc(f.dir.replace(/\S.*$/, ""))}<i class="chev" aria-hidden="true">${isOpen ? "▾" : "▸"}</i>${esc(f.dir.trim())}<span class="cnt">${f.n}</span></button>`;
      }
      return `<button type="button" role="option" data-file="${esc(f.path)}" aria-selected="${f.path === selected}">${esc(f.f)}<span class="tag">${f.tag}</span></button>`;
    });
    $("#tree").innerHTML = `<div class="tree-tools"><button type="button" data-tree="open">${L(UI["tree.open"])}</button><button type="button" data-tree="close">${L(UI["tree.close"])}</button></div>` + rows.join("");
    renderDetail();
  }
  function renderDetail() {
    const f = FILES.find((x) => x.path === selected) || FIRST_FILE;
    const step = f.step ? `<button type="button" class="step-link" data-gostep="${f.step}">${L(UI["step.ref"])} ${roman(f.step)} →</button>` : `<span class="step-link muted">${L(UI["step.none"])}</span>`;
    $("#detail").innerHTML = `<span class="path">${esc(f.path)}</span><p>${L(f.p)}</p>${step}${plate(f.code, f.g, f.path.replace(/^orders\//, ""))}`;
  }

  /* ── IV · Step by step ── */
  const fsel = {};
  function fileset(i, s) {
    const k = fsel[i] || 0, c = s.code[k];
    const tabs = s.code.length > 1
      ? `<div class="fs-tabs" role="tablist">${s.code.map((x, j) => `<button type="button" role="tab" data-fs="${i}:${j}" aria-selected="${j === k}">${esc(x[2])}</button>`).join("")}</div>`
      : "";
    return `<div class="fileset" id="fs-${i}">${tabs}${plate(c[0], c[1], c[3])}</div>`;
  }
  function renderSteps() {
    $("#steps-list").innerHTML = STEPS.map((s, i) => `<li class="step" id="step-${i + 1}"><div class="step-n">${roman(i + 1)}</div><div class="step-body">` +
      `<h3>${L(s.t)}</h3><p>${L(s.p)}</p>` +
      (s.table ? `<div class="kv-wrap"><table class="kv"><tbody>${s.table.map(([k, v]) => `<tr><th scope="row">${typeof k === "string" ? k : L(k)}</th><td>${typeof v === "string" ? `<code>${esc(v)}</code>` : L(v)}</td></tr>`).join("")}</tbody></table></div>` : "") +
      `<div class="chips">${s.files.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}</div>` +
      fileset(i, s) +
      (s.note ? `<p class="note">${L(s.note)}</p>` : "") +
      `</div></li>`).join("");
  }

  /* ── V ── */
  let tab = store.get("atelier.tab") || "sinon";
  function renderAdvanced() {
    if (!ADVANCED.some((a) => a.id === tab)) tab = "sinon";
    $("#adv-tabs").innerHTML = ADVANCED.map((a) => `<button type="button" role="tab" id="tab-${a.id}" data-tab="${a.id}" aria-selected="${a.id === tab}" tabindex="${a.id === tab ? 0 : -1}">${L(a.tab)}</button>`).join("");
    const a = ADVANCED.find((x) => x.id === tab);
    const panel = $("#adv-panel");
    panel.setAttribute("aria-labelledby", "tab-" + a.id);
    panel.innerHTML = `<h3>${L(a.t)}</h3><p>${L(a.p)}</p>${a.code.map((c) => plate(c[0], c[1], c[2])).join("")}`;
  }

  /* ── VI ── */
  let done = new Set();
  try { done = new Set(JSON.parse(store.get("atelier.done") || "[]")); } catch (e) { done = new Set(); }
  function renderPractices() {
    $("#ledger").innerHTML = PRACTICES.map((p, i) => `<label for="bp-${i}"><input type="checkbox" id="bp-${i}" data-bp="${i}" ${done.has(i) ? "checked" : ""}><div><b>${L(p.b)}</b><span>${L(p.s)}</span></div></label>`).join("");
    $("#total").textContent = PRACTICES.length;
    $("#done").textContent = done.size;
    $("#pairs").innerHTML = PAIRS.map((p) => `<div class="pair"><div class="no"><span class="lbl">${L(UI.avoid)}</span><p>${L(p.no)}</p></div><div class="yes"><span class="lbl">${L(UI.prefer)}</span><p>${L(p.yes)}</p></div></div>`).join("");
  }


  /* ── VII · Glossary ── */
  let gq = "", gcat = "all";
  const plain = (s) => (s || "").replace(/<[^>]+>/g, "");
  const keyOf = (g) => g.term.replace(/^[^A-Za-z]+/, "").toUpperCase();
  const GSORTED = GLOSSARY.slice().sort((x, y) => keyOf(x).localeCompare(keyOf(y)));
  const gById = (id) => GLOSSARY.find((g) => g.id === id);
  function gMatches(g) {
    if (gcat !== "all" && g.cat !== gcat) return false;
    if (!gq) return true;
    const hay = [g.term, L(g.alias), plain(L(g.what)), plain(L(g.why))].join(" ").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return gq.split(/\s+/).every((w) => hay.includes(w));
  }
  function renderGlossaryShell() {
    const hd = L(DOUBLES.head);
    $("#g-table").innerHTML = `<thead><tr>${hd.map((x, i) => `<th scope="col"${i ? "" : ' aria-label="Test double"'}>${x}</th>`).join("")}</tr></thead><tbody>` +
      DOUBLES.rows.map((r) => `<tr><th scope="row"><button type="button" data-goto="${r[0]}">${gById(r[0]).term}</button></th>` +
        r.slice(1).map((v) => `<td><span class="gem ${v ? "y" : "n"}" role="img" aria-label="${v ? "yes" : "no"}"></span></td>`).join("") + "</tr>").join("") + "</tbody>";
    const q = $("#g-q"); q.placeholder = L(UI["g.search"]); q.setAttribute("aria-label", L(UI["g.search"]));
    $("#g-cats").innerHTML = [["all", UI["g.all"]], ...Object.entries(GLOSS_CATS)]
      .map(([k, v]) => `<button type="button" data-gcat="${k}" aria-pressed="${k === gcat}">${L(v)}</button>`).join("");
    renderGlossary();
  }
  function renderGlossary() {
    const list = GSORTED.filter(gMatches);
    const letters = new Set(list.map((g) => keyOf(g)[0]));
    $("#g-letters").innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map((c) =>
      `<button type="button" data-gletter="${c}" ${letters.has(c) ? "" : "disabled"}>${c}</button>`).join("");
    $("#g-count").textContent = `${list.length} ${L(UI["g.count"])}`;
    if (!list.length) { $("#g-list").innerHTML = `<p class="g-empty">${L(UI["g.none"])}</p>`; return; }
    let last = "", out = "";
    for (const g of list) {
      const c = keyOf(g)[0];
      if (c !== last) { out += `<div class="g-letter" id="g-letter-${c}">${c}</div>`; last = c; }
      const alias = L(g.alias);
      out += `<article class="g-entry" id="g-${g.id}">` +
        `<div class="g-term"><h3>${esc(g.term)}</h3>${alias && alias !== g.term ? `<em>${alias}</em>` : ""}<span class="g-tag">${L(GLOSS_CATS[g.cat])}</span></div>` +
        `<div class="g-body"><div><h4>${L(UI["g.what"])}</h4><p>${L(g.what)}</p></div>` +
        `<div><h4>${L(UI["g.why"])}</h4><p>${L(g.why)}</p></div>` +
        (g.code ? `<div class="plate"><pre><code>${highlight(g.code, "javascript")}</code></pre></div>` : "") +
        (g.rel && g.rel.length ? `<div class="g-rel"><span>${L(UI["g.rel"])}</span>${g.rel.map((r) => `<button type="button" data-goto="${r}">${esc(gById(r).term)}</button>`).join("")}</div>` : "") +
        `</div></article>`;
    }
    $("#g-list").innerHTML = out;
  }
  function gGoto(id) {
    if (!document.getElementById("g-" + id)) { gq = ""; gcat = "all"; $("#g-q").value = ""; renderGlossaryShell(); }
    const el = document.getElementById("g-" + id);
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
  }

  /* ── VIII ── */
  function renderRefs() {
    $("#refs-list").innerHTML = REFS.map((r) => `<a href="${r.u}" target="_blank" rel="noopener"><div><b>${r.b}</b><span>${L(r.s)}</span></div><i>${esc(r.u.replace(/^https:\/\//, "").replace(/\/$/, ""))}</i></a>`).join("");
  }

  function renderAll() {
    renderStatic(); renderIndex(); renderIntro(); renderConcepts(); renderTree(); renderSteps(); renderAdvanced(); renderPractices(); renderGlossaryShell(); renderRefs();
    markActive();
  }

  /* ── Collection switch: a circular reveal from the switcher ── */
  const frames = (n) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  function setCollection(next, btn) {
    if (next === collection) return;
    const apply = () => {
      collection = next; root.dataset.collection = next; store.set("atelier.collection", next);
      renderStatic();
      document.dispatchEvent(new Event("collectionchange"));
      return frames(4); // let the new hero paint its first frames before the reveal
    };
    const r = btn.getBoundingClientRect();
    root.style.setProperty("--vt-x", (r.left + r.width / 2) + "px");
    root.style.setProperty("--vt-y", (r.top + r.height / 2) + "px");
    if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      try { document.startViewTransition(apply); return; } catch (e) { /* fall through */ }
    }
    apply();
  }

  /* ── Events ── */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a");
    if (!t) return;
    if (t.dataset.collectionSet) { setCollection(t.dataset.collectionSet, t); return; }
    if (t.dataset.lang) { lang = t.dataset.lang; store.set("atelier.lang", lang); renderAll(); return; }
    if (t.dataset.fs) {
      const [i, j] = t.dataset.fs.split(":").map(Number); fsel[i] = j;
      $("#fs-" + i).outerHTML = fileset(i, STEPS[i]);
      const b = document.querySelector(`[data-fs="${i}:${j}"]`); if (b) b.focus();
      return;
    }
    if (t.dataset.gostep) {
      const el = document.getElementById("step-" + t.dataset.gostep);
      if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      return;
    }
    if (t.dataset.dir !== undefined && t.closest("#tree")) {
      const d = t.dataset.dir; open.has(d) ? open.delete(d) : open.add(d); saveOpen(); renderTree();
      const b = document.querySelector(`#tree [data-dir="${d}"]`); if (b) b.focus();
      return;
    }
    if (t.dataset.tree) {
      if (t.dataset.tree === "open") FILES.forEach((f) => { if (f.dir) open.add(f.dpath); });
      else { open = new Set(["", ...ancOf(selected).slice(0, 2)]); }
      saveOpen(); renderTree(); return;
    }
    if (t.dataset.file) {
      selected = t.dataset.file; store.set("atelier.file2", selected);
      document.querySelectorAll("#tree [data-file]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.file === selected)));
      renderDetail(); return;
    }
    if (t.dataset.tab) { tab = t.dataset.tab; store.set("atelier.tab", tab); renderAdvanced(); $("#tab-" + tab).focus(); return; }
    if (t.dataset.copy) {
      const text = src(t.dataset.copy);
      const ok = () => { t.textContent = L(UI.copied); setTimeout(() => { t.textContent = L(UI.copy); }, 1600); };
      const fallback = () => {
        const pre = t.closest(".plate").querySelector("pre");
        const r = document.createRange(); r.selectNodeContents(pre);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      };
      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
      return;
    }
    if (t.dataset.gcat) { gcat = t.dataset.gcat; document.querySelectorAll("[data-gcat]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.gcat === gcat))); renderGlossary(); return; }
    if (t.dataset.gletter) { const el = document.getElementById("g-letter-" + t.dataset.gletter); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (t.dataset.goto) { gGoto(t.dataset.goto); return; }
    if (t.id === "reset") { done.clear(); store.set("atelier.done", "[]"); renderPractices(); return; }
    if (t.id === "theme-toggle") {
      const root = document.documentElement;
      const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      root.dataset.theme = cur === "dark" ? "light" : "dark";
    }
  });
  document.addEventListener("change", (e) => {
    const i = e.target.dataset && e.target.dataset.bp;
    if (i === undefined) return;
    e.target.checked ? done.add(+i) : done.delete(+i);
    store.set("atelier.done", JSON.stringify([...done]));
    $("#done").textContent = done.size;
  });
  $("#g-q").addEventListener("input", (e) => {
    gq = e.target.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    renderGlossary();
  });
  $("#adv-tabs").addEventListener("keydown", (e) => {
    if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
    const i = ADVANCED.findIndex((a) => a.id === tab);
    const n = (i + (e.key === "ArrowRight" ? 1 : -1) + ADVANCED.length) % ADVANCED.length;
    tab = ADVANCED[n].id; store.set("atelier.tab", tab); renderAdvanced(); $("#tab-" + tab).focus();
    e.preventDefault();
  });

  /* ── Scroll: active chapter + reading progress ── */
  function markActive() {
    const y = window.scrollY + 140;
    let cur = NAV[0].id;
    NAV.forEach((n) => { const el = document.getElementById(n.id); if (el && el.offsetTop <= y) cur = n.id; });
    document.querySelectorAll("#index a").forEach((a) => a.classList.toggle("on", a.dataset.sec === cur));
    const h = document.documentElement.scrollHeight - window.innerHeight;
    $("#prog").style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + "%";
  }
  window.addEventListener("scroll", markActive, { passive: true });

  renderAll();
})();

</script>
<script>
/* Jardin collection: a mother-of-pearl garden. Pearls drift like pollen; near the cursor,
   gold vines with enamel leaves grow between them; a click makes a flower bloom.
   The seal holds a flower whose petals are set with gems. */
(function () {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const root = document.documentElement;
  const active = () => root.dataset.collection === "jardin";
  const dark = () => root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  const easeBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

  /* ═════════ 1 · GARDEN — pearls, growing vines, blooms ═════════ */
  const cv = document.getElementById("garden");
  const host = document.getElementById("top");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, pearls = [], visible = true, loop = false;
  const LINK = 130, REACH = 190;
  const mouse = { x: 0, y: 0, on: false, a: 0 };
  const vines = new Map();
  const blooms = [];
  const t0 = performance.now();

  function seed() {
    const n = Math.round(Math.min(90, Math.max(30, (W * H) / 16000)));
    pearls = Array.from({ length: n }, () => ({
      x: rnd(0, W), y: rnd(0, H), r: Math.random() < .14 ? rnd(5.5, 8) : rnd(2, 4.6),
      ph: rnd(0, TAU), sp: rnd(.25, .6), drift: rnd(.08, .22), hue: rnd(160, 330), d: 1e9
    }));
  }
  function resize() {
    const r = host.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  }

  function pearl(x, y, r, hue, glow) {
    const nightMode = dark();
    if (!nightMode) {
      ctx.fillStyle = "rgba(30,42,58,.10)";
      ctx.beginPath(); ctx.ellipse(x + r * .25, y + r * .55, r * .9, r * .45, 0, 0, TAU); ctx.fill();
    } else if (glow > 0) {
      const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
      halo.addColorStop(0, `hsla(${hue},70%,85%,${.25 * glow})`); halo.addColorStop(1, "hsla(0,0%,100%,0)");
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, TAU); ctx.fill();
    }
    const g = ctx.createRadialGradient(x - r * .38, y - r * .42, r * .08, x, y, r);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(.42, `hsla(${hue},38%,94%,1)`);
    g.addColorStop(.8, `hsla(${(hue + 45) % 360},34%,${nightMode ? 74 : 82}%,1)`);
    g.addColorStop(1, `hsla(${(hue + 95) % 360},30%,${nightMode ? 60 : 70}%,1)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  // point + tangent on a quadratic curve
  function qpt(ax, ay, cx, cy, bx, by, t) {
    const u = 1 - t;
    return [u * u * ax + 2 * u * t * cx + t * t * bx, u * u * ay + 2 * u * t * cy + t * t * by,
            2 * u * (cx - ax) + 2 * t * (bx - cx), 2 * u * (cy - ay) + 2 * t * (by - cy)];
  }
  function leaf(x, y, ang, s, enamel) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(s * .6, -s * .55, s * 1.25, 0); ctx.quadraticCurveTo(s * .6, s * .55, 0, 0);
    const g = ctx.createLinearGradient(0, 0, s * 1.25, 0);
    if (enamel) { g.addColorStop(0, "rgba(28,110,112,.95)"); g.addColorStop(1, "rgba(120,200,190,.9)"); }
    else { g.addColorStop(0, "rgba(150,112,58,.95)"); g.addColorStop(1, "rgba(236,208,150,.95)"); }
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = .5; ctx.strokeStyle = "rgba(169,134,79,.9)"; ctx.stroke();
    ctx.restore();
  }
  function vine(a, b, grow, seedSign, alpha) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const cx = (a.x + b.x) / 2 - dy / d * d * .28 * seedSign, cy = (a.y + b.y) / 2 + dx / d * d * .28 * seedSign;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    const steps = 18;
    for (let k = 1; k <= steps; k++) {
      const t = k / steps * grow; const [x, y] = qpt(a.x, a.y, cx, cy, b.x, b.y, t); ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(169,134,79,${alpha})`; ctx.lineWidth = 1.1; ctx.stroke();
    [.32, .58, .82].forEach((lt, k) => {
      if (grow < lt) return;
      const [x, y, tx, ty] = qpt(a.x, a.y, cx, cy, b.x, b.y, lt);
      const s = 5.5 * ease(Math.min(1, (grow - lt) / .18));
      const side = k % 2 ? 1 : -1;
      leaf(x, y, Math.atan2(ty, tx) + side * .9, s, k === 1);
    });
    if (grow > .98) { // a tiny pearl bud at the tip
      const [x, y] = qpt(a.x, a.y, cx, cy, b.x, b.y, .5);
      ctx.globalAlpha = alpha; pearl(x, y, 1.6, 300, 0); ctx.globalAlpha = 1;
    }
  }

  function petal(len, wid, hue, alpha) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(wid, -len * .25, wid * .9, -len * .85, 0, -len);
    ctx.bezierCurveTo(-wid * .9, -len * .85, -wid, -len * .25, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0, `hsla(${hue},55%,82%,${alpha})`);
    g.addColorStop(.6, `hsla(${(hue + 40) % 360},45%,94%,${alpha})`);
    g.addColorStop(1, `hsla(${(hue + 80) % 360},60%,98%,${alpha})`);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = .7; ctx.strokeStyle = `rgba(169,134,79,${alpha * .9})`; ctx.stroke();
  }
  function drawBloom(bl, now) {
    const age = Math.max(0, (now - bl.t0) / 1000);
    if (age > 3.2) return false;
    const open = easeBack(Math.min(1, age / .9));
    const fall = Math.max(0, (age - 1.8) / 1.4);
    ctx.save(); ctx.translate(bl.x, bl.y); ctx.rotate(bl.rot + age * .15);
    for (let k = 0; k < bl.n; k++) {
      ctx.save();
      const ang = k / bl.n * TAU;
      ctx.rotate(ang);
      if (fall > 0) ctx.translate(Math.sin(ang * 3 + k) * 30 * fall, -40 * fall * (1 + k % 3 * .4));
      ctx.scale(open, open);
      petal(bl.size, bl.size * .42, bl.hue + k * 6, 1 - fall);
      ctx.restore();
    }
    // inner petals, a turn offset
    for (let k = 0; k < bl.n; k++) {
      ctx.save(); ctx.rotate((k + .5) / bl.n * TAU); ctx.scale(open * .6, open * .6);
      petal(bl.size, bl.size * .38, (bl.hue + 60) % 360, (1 - fall) * .9); ctx.restore();
    }
    // stamens: gold beads around a pearl heart
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU, rr = bl.size * .22 * open;
      ctx.fillStyle = `rgba(214,178,110,${1 - fall})`;
      ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.6, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1 - fall; pearl(0, 0, bl.size * .16 * open + .1, 200, 1); ctx.globalAlpha = 1;
    ctx.restore();
    return true;
  }

  function frame(now) {
    if (!active() || !visible) { loop = false; return; }
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    const gx = W * (.7 + .15 * Math.sin(t * .21)), gy = H * (.5 + .26 * Math.sin(t * .29 + 1));
    const lx = mouse.on ? mouse.x : gx, ly = mouse.on ? mouse.y : gy;
    mouse.a += ((mouse.on ? 1 : .45) - mouse.a) * .06;

    for (const p of pearls) {
      p.x += Math.sin(t * p.sp + p.ph) * p.drift; p.y -= p.drift * .6;
      if (p.y < -12) { p.y = H + 12; p.x = rnd(0, W); }
      if (p.x < -12) p.x = W + 12; if (p.x > W + 12) p.x = -12;
      p.d = Math.hypot(p.x - lx, p.y - ly);
      if (p.d < REACH && p.d > REACH * .5) { p.x += (lx - p.x) * .002 * mouse.a; p.y += (ly - p.y) * .002 * mouse.a; }
    }
    // faint ambient threads
    ctx.lineWidth = .5;
    for (let i = 0; i < pearls.length; i++) for (let j = i + 1; j < pearls.length; j++) {
      const a = pearls[i], b = pearls[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > LINK) continue;
      const key = i * 1000 + j, near = a.d < REACH && b.d < REACH;
      let g = vines.get(key) || 0;
      g = near ? g + (1 - g) * .05 * (1 + mouse.a) : g - .03;
      if (g <= 0) { vines.delete(key); ctx.strokeStyle = `rgba(169,134,79,${(1 - d / LINK) * .14})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); continue; }
      vines.set(key, Math.min(1, g));
      vine(a, b, Math.min(1, g), (i + j) % 2 ? 1 : -1, .35 + .5 * (1 - d / LINK) * mouse.a);
    }
    // tendrils from the cursor to the three nearest pearls
    if (mouse.on) {
      pearls.filter((p) => p.d < REACH).sort((p, q) => p.d - q.d).slice(0, 3)
        .forEach((p, k) => vine({ x: lx, y: ly }, p, Math.min(1, mouse.a), k % 2 ? 1 : -1, .55));
    }
    for (const p of pearls) pearl(p.x, p.y, p.r * (p.d < REACH ? 1 + .35 * (1 - p.d / REACH) * mouse.a : 1), p.hue, p.d < REACH ? 1 : .3);
    for (let i = blooms.length - 1; i >= 0; i--) if (!drawBloom(blooms[i], now)) blooms.splice(i, 1);

    if (reduce) { loop = false; return; }
    requestAnimationFrame(frame);
  }
  function start() { if (loop || !active()) return; loop = true; requestAnimationFrame(frame); }

  host.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" || !active()) return;
    const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.on = true;
  });
  host.addEventListener("pointerleave", () => { mouse.on = false; });
  host.addEventListener("pointerdown", (e) => {
    if (!active() || e.target.closest("a,button")) return;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    blooms.push({ x, y, t0: performance.now(), n: 6, size: rnd(26, 36), rot: rnd(0, TAU), hue: rnd(170, 330) });

  const bx = bc.getContext("2d");
  let BW = 0, BD = 1, petalA = null, petalB = null, bLoop = false, hover = 0, tiltT = 0, tilt = 0;
  // petal outline in a 100-unit box: base at the centre (0,0), tip along +x

      for (let x = (row % 2) * step / 2; x < w; x += step) {
        const dist = Math.hypot(x, y) / 74;
        const pearlStone = Math.random() < .07;
        const hue = pearlStone ? 330 : hueA + (hueB - hueA) * Math.min(1, dist) + rnd(-8, 8);
        const rg = g.createRadialGradient(x - 1, y - 1, .2, x, y, 2.9);
        if (pearlStone) { rg.addColorStop(0, "#fff"); rg.addColorStop(.6, "hsl(330,40%,92%)"); rg.addColorStop(1, "hsl(200,30%,78%)"); }

    g.strokeStyle = "rgba(214,178,110,.95)"; g.lineWidth = 1.6; g.beginPath(); shape(g); g.stroke();
    g.lineWidth = .7; g.strokeStyle = "rgba(214,178,110,.7)";
    g.beginPath(); g.moveTo(4, 0); g.quadraticCurveTo(w * .5, -2, w * .9, 0); g.stroke();

  }
  function bresize() {
    const r = bc.getBoundingClientRect();

  }
  function brender(now) {
    if (!active()) { bLoop = false; return; }

    hover += ((tiltT ? 1 : 0) - hover) * .05; tilt += (tiltT - tilt) * .06;
    bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, bc.width, bc.height);
    const k = BW / 230 * BD, cx = bc.width / 2, cy = bc.height / 2 + Math.sin(t * 1.3) * 3 * BD;

      const g = bx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);

    const pr = 7 * k, pg = bx.createRadialGradient(-pr * .3, -pr * .3, pr * .1, 0, 0, pr);

      bx.globalCompositeOperation = "lighter"; bx.globalAlpha = (ga - .6) / .4;
      [0, Math.PI / 2].forEach((an) => {
        const L = (an ? 7 : 13) * k;
        const lg = bx.createLinearGradient(gxp - L, gyp, gxp + L, gyp);
        lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(.5, "#fff"); lg.addColorStop(1, "rgba(255,255,255,0)");
        bx.save(); bx.translate(gxp, gyp); bx.rotate(an); bx.translate(-gxp, -gyp);
        bx.strokeStyle = lg; bx.lineWidth = 1.2; bx.beginPath(); bx.moveTo(gxp - L, gyp); bx.lineTo(gxp + L, gyp); bx.stroke(); bx.restore();

  }
  function bstart() { if (bLoop || !active()) return; bLoop = true; requestAnimationFrame(brender); }
  const fig = bc.closest(".hallmark");
  fig.addEventListener("pointermove", (e) => {
    if (!active()) return;

  });
  fig.addEventListener("pointerleave", () => { tiltT = 0; });

  /* ── lifecycle ── */
  function boot() {
    if (!active()) return;
    if (!W) resize();
    if (!BW) bresize();

  }
  window.addEventListener("resize", () => { if (active()) { resize(); bresize(); if (reduce) { frame(performance.now()); brender(performance.now()); } } else { W = 0; BW = 0; } });

  }

  boot();
})();

<script>
/* Calibre collection: fine watchmaking. A guilloché dial turns slowly behind a field of
   gear wheels; near the cursor the wheels engage, speed up and are joined by bridges set
   with ruby jewels; a click marks time with a sweeping hand. The seal holds a tourbillon. */
(function () {
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const root = document.documentElement;
  const active = () => root.dataset.collection === "calibre";
  const dark = () => root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ease = (x) => 1 - Math.pow(1 - x, 3);
  function palette() {
    return dark()
      ? { line: "rgba(214,222,232,", rose: "217,169,137", blue: "120,160,230", steel: "#C9D2DC", steelDk: "#6F7A88", guil: "rgba(255,255,255,.05)" }
      : { line: "rgba(20,32,47,", rose: "176,122,90", blue: "31,78,140", steel: "#6A7480", steelDk: "#2B3540", guil: "rgba(20,32,47,.06)" };
  }

  /* ═════════ 1 · MOVEMENT — guilloché, wheels, bridges, time marks ═════════ */
  const cv = document.getElementById("movement");
  const host = document.getElementById("top");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, DCX = 0, DCY = 0, gears = [], guil = null, guilDark = null, loop = false, visible = true;
  const REACH = 210, LINK = 170;
  const mouse = { x: 0, y: 0, on: false, a: 0 };
  const marks = [];
  const t0 = performance.now();

  function buildGuilloche(isDark) {
    const S = Math.round(Math.max(W, H) * 1.15);
    const c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d"); const R = S / 2;
    g.translate(R, R); g.lineWidth = .6; g.strokeStyle = isDark ? "rgba(255,255,255,.055)" : "rgba(20,32,47,.07)";
    // rose-engine rosette: circles whose centres travel on a smaller circle
    for (let k = 0; k < 120; k++) {
      const a = k / 120 * TAU;
      g.beginPath(); g.arc(Math.cos(a) * R * .16, Math.sin(a) * R * .16, R * .42, 0, TAU); g.stroke();
    }

      for (let i = 0; i <= 720; i++) {
        const a = i / 720 * TAU, rr = R * (.66 + k * .025) + Math.sin(a * 48 + k) * R * .008;
        i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.stroke();
    }

      const a = i / 60 * TAU, L = i % 5 ? R * .02 : R * .045;
      g.beginPath(); g.moveTo(Math.cos(a) * R * .76, Math.sin(a) * R * .76); g.lineTo(Math.cos(a) * (R * .76 - L), Math.sin(a) * (R * .76 - L)); g.stroke();

  }
  function seed() {
    gears = [];
    const target = Math.round(Math.min(34, Math.max(14, (W * H) / 38000)));
    let tries = 0;
    while (gears.length < target && tries++ < 4000) {
      const r = Math.random() < .2 ? rnd(26, 40) : rnd(9, 20);
      const x = rnd(-10, W + 10), y = rnd(-10, H + 10);
      if (gears.some((g) => Math.hypot(g.x - x, g.y - y) < g.r + r + 22)) continue;
      gears.push({ x, y, r, teeth: Math.round(r * .55) + 8, ang: rnd(0, TAU), dir: Math.random() < .5 ? 1 : -1, spin: 1, d: 1e9, spokes: r > 18 ? 5 : 4 });
    }
  }
  function resize() {
    const rect = host.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // centre the dial on the seal so the tourbillon sits at its heart
    const sr = document.getElementById("tourbillon").getBoundingClientRect();
    DCX = sr.width ? sr.left - rect.left + sr.width / 2 : W * .74;

  function ruby(x, y, r) {

    g.addColorStop(0, "#ffd9df"); g.addColorStop(.35, "#d2283f"); g.addColorStop(1, "#5a0d18");

  }

    const { x, y, r, teeth, ang } = gr;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    const tip = r + Math.max(2.2, r * .1);
    for (let i = 0; i < teeth; i++) {
      const a0 = i / teeth * TAU, a1 = (i + .5) / teeth * TAU, aw = TAU / teeth;
      ctx.lineTo(Math.cos(a0) * r, Math.sin(a0) * r);
      ctx.lineTo(Math.cos(a0 + aw * .12) * tip, Math.sin(a0 + aw * .12) * tip);
      ctx.lineTo(Math.cos(a1 - aw * .12) * tip, Math.sin(a1 - aw * .12) * tip);
      ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(${P.rose},${.07 + .18 * k})`; ctx.fill();
    ctx.lineWidth = .8; ctx.strokeStyle = k > .05 ? `rgba(${P.rose},${.45 + .5 * k})` : P.line + ".26)"; ctx.stroke();

    ctx.beginPath(); ctx.arc(0, 0, r * .22, 0, TAU); ctx.stroke();

      const a = i / gr.spokes * TAU;

    ctx.strokeStyle = `rgba(${P.rose},${alpha * .9})`; ctx.lineWidth = .8;

      const sx = p.x + (b.x - a.x) * (p === a ? .14 : -.14), sy = p.y + (b.y - a.y) * (p === a ? .14 : -.14);

      ctx.strokeStyle = `rgba(255,255,255,${alpha * .6})`; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(sx - 1.6, sy); ctx.lineTo(sx + 1.6, sy); ctx.stroke();
    });
  }

    const sweep = ease(Math.min(1, age / 1.3));

    for (let i = 0; i < 60; i++) {
      const a = i / 60 * TAU - Math.PI / 2;

      ctx.beginPath(); ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R); ctx.lineTo(Math.cos(a) * (R - L), Math.sin(a) * (R - L)); ctx.stroke();

    ctx.strokeStyle = `rgba(${P.blue},${fade})`; ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-Math.cos(ha) * 12, -Math.sin(ha) * 12); ctx.lineTo(Math.cos(ha) * (R - 12), Math.sin(ha) * (R - 12)); ctx.stroke();

    const gx = W * (.62 + .2 * Math.sin(t * .19)), gy = H * (.5 + .28 * Math.sin(t * .27 + .8));
    const lx = mouse.on ? mouse.x : gx, ly = mouse.on ? mouse.y : gy;

      const a = gears[i], b = gears[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > LINK) continue;

      else { ctx.strokeStyle = P.line + (1 - d / LINK) * .12 + ")"; ctx.lineWidth = .5; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }

    if (reduce) { loop = true; frame(performance.now()); }
  });

  /* ═════════ 2 · TOURBILLON — in the seal ═════════ */

  function bresize() {
    const r = bc.getBoundingClientRect(); BD = Math.min(2, window.devicePixelRatio || 1); BW = r.width;

    g.beginPath(); g.arc(0, 0, r * .25, 0, TAU); g.stroke();
    for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; g.beginPath(); g.moveTo(Math.cos(a) * r * .25, Math.sin(a) * r * .25); g.lineTo(Math.cos(a) * r * .8, Math.sin(a) * r * .8); g.stroke(); }
    g.restore();
  }

    const rg = g.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
    rg.addColorStop(0, "#ffd9df"); rg.addColorStop(.35, "#d2283f"); rg.addColorStop(1, "#5a0d18");
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

    if (!active()) { bLoop = false; return; }
    const t = now / 1000, dt = lastT ? Math.min(.05, t - lastT) : 0; lastT = t;
    const P = palette(); const S = bc.width, s = S / 300, rose = `rgb(${P.rose})`, blue = `rgb(${P.blue})`;
    hover += (hoverT - hover) * .05;
    cageAng += dt * TAU / (20 - hover * 14); // one turn per 20 s (faster on hover)
    const beat = Math.sin(t * TAU * 1.25);          // 2.5 Hz visual beat (18,000 vph is 2.5 Hz)
    const B = 2.5 * beat;
    bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, S, S);
    bx.translate(S / 2, S / 2 - 6 * s);
    // fixed bridge (behind the cage): a curved rose-gold arm
    bx.lineCap = "round"; bx.strokeStyle = `rgba(${P.rose},.55)`; bx.lineWidth = 9 * s;
    bx.beginPath(); bx.arc(0, 0, 112 * s, Math.PI * .78, Math.PI * 1.22); bx.stroke();
    // rotating cage
    bx.save(); bx.rotate(cageAng);
    // escape wheel and pallet fork ride on the cage
    const ex = Math.cos(-.9) * 62 * s, ey = Math.sin(-.9) * 62 * s;
    const escAng = Math.floor(t * 5) / 15 * TAU + ease((t * 5) % 1) / 15 * TAU * .15;
    bx.save(); bx.translate(ex, ey); wheel(bx, 20 * s, 15, escAng, P.steel, 1 * s); bx.restore();
    bruby(bx, ex, ey, 3 * s);
    bx.save(); bx.translate(ex * .5, ey * .5); bx.rotate(-.9 + .18 * Math.sign(beat) * Math.min(1, Math.abs(beat) * 3));
    bx.strokeStyle = P.steel; bx.lineWidth = 2.2 * s; bx.beginPath(); bx.moveTo(-30 * s, 0); bx.lineTo(30 * s, 0); bx.stroke();
    bruby(bx, -30 * s, 0, 2.2 * s); bruby(bx, 30 * s, 0, 2.2 * s);
    bx.restore();
    // cage: three lyre arms with blued screws
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * TAU;
      bx.save(); bx.rotate(a);
      bx.strokeStyle = P.steel; bx.lineWidth = 3.2 * s;
      bx.beginPath(); bx.moveTo(0, 0); bx.quadraticCurveTo(38 * s, -30 * s, 0, -92 * s); bx.stroke();
      bx.beginPath(); bx.moveTo(0, 0); bx.quadraticCurveTo(-38 * s, -30 * s, 0, -92 * s); bx.stroke();
      bx.fillStyle = blue; bx.beginPath(); bx.arc(0, -92 * s, 4.4 * s, 0, TAU); bx.fill();
      bx.strokeStyle = "rgba(255,255,255,.7)"; bx.lineWidth = .8 * s; bx.beginPath(); bx.moveTo(-3 * s, -92 * s); bx.lineTo(3 * s, -92 * s); bx.stroke();
      bx.restore();
    }
    bx.strokeStyle = P.steel; bx.lineWidth = 1.4 * s; bx.beginPath(); bx.arc(0, 0, 92 * s, 0, TAU); bx.stroke();
    // balance wheel: oscillating rim with timing screws
    bx.save(); bx.rotate(B);
    bx.strokeStyle = rose; bx.lineWidth = 4 * s; bx.beginPath(); bx.arc(0, 0, 54 * s, 0, TAU); bx.stroke();
    bx.lineWidth = 2.4 * s;
    for (let i = 0; i < 3; i++) { const a = i / 3 * TAU; bx.beginPath(); bx.moveTo(0, 0); bx.lineTo(Math.cos(a) * 54 * s, Math.sin(a) * 54 * s); bx.stroke(); }
    for (let i = 0; i < 8; i++) {
      const a = (i + .5) / 8 * TAU;
      bx.fillStyle = i % 2 ? `rgb(${P.rose})` : P.steelDk;
      bx.beginPath(); bx.arc(Math.cos(a) * 57 * s, Math.sin(a) * 57 * s, 2.6 * s, 0, TAU); bx.fill();
    }
    bx.restore();
    // hairspring: an Archimedean spiral that breathes with the balance
    bx.strokeStyle = blue; bx.lineWidth = 1 * s; bx.beginPath();
    const turns = 9, breath = 1 + .06 * beat;
    for (let i = 0; i <= 900; i++) {
      const u = i / 900, a = u * turns * TAU + B * .9 * u, r = (7 + u * 33 * breath) * s;
      i ? bx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : bx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    bx.stroke();
    bruby(bx, 0, 0, 5 * s);
    bx.restore();
    if (reduce) { bLoop = false; return; }
    requestAnimationFrame(brender);
  }
  function bstart() { if (bLoop || !active()) return; bLoop = true; lastT = 0; requestAnimationFrame(brender); }
  const fig = bc.closest(".hallmark");
  fig.addEventListener("pointerenter", () => { hoverT = 1; });
  fig.addEventListener("pointerleave", () => { hoverT = 0; });

  /* ── lifecycle ── */
  function boot() { if (!active()) return; if (!W) resize(); if (!BW) bresize(); start(); bstart(); }
  window.addEventListener("resize", () => { if (active()) { resize(); bresize(); if (reduce) { frame(performance.now()); brender(performance.now()); } } else { W = 0; BW = 0; } });
  if ("IntersectionObserver" in window) new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) boot(); }).observe(host);
  document.addEventListener("collectionchange", () => { if (active()) { W = 0; BW = 0; requestAnimationFrame(boot); } });
  boot();
})();

</script>
