<style>
/* Layout: a collection lookbook — fixed chapter index on the left, one measured reading column, code set like engraved plates. */
:root{
  --paper:#F7F6F3; --paper-2:#EFEDE8; --ink:#141312; --ink-2:#55524D; --ink-3:#8A867F;
  --line:#D9D5CD; --gold:#8C6B3E; --gold-soft:#B8996A; --plate:#FFFFFF; --plate-ink:#1B1A18;
  --ok:#2F6B4F; --ko:#8E2F2F;
  --tok-c:#8A867F; --tok-k:#7A4F86; --tok-s:#2F6B4F; --tok-n:#8C6B3E; --tok-f:#1F4E79; --tok-t:#8E2F2F;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --measure:44rem;
  /* Hero: a black-velvet display tray in both themes */
  --velvet:#0A0A0C; --velvet-2:#17151B; --pearl:#F3EFE7; --pearl-2:#B9B2A6; --pearl-3:#7E786F; --champagne:#D4B483;
  --em-grad:linear-gradient(100deg,#D4B483 0%,#F6E7C8 22%,#D4B483 40%,#E8D3AE 60%,#D4B483 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);
  --ring:rgba(243,239,231,.14); --ghost-line:rgba(243,239,231,.35); --code-bg-hero:rgba(255,255,255,.07);
  --gem-hi:#F6E7C8; --gem-lo:#6E5230;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F0E0D; --paper-2:#171614; --ink:#EDE9E2; --ink-2:#B5AFA5; --ink-3:#7D776E;
  --line:#2C2925; --gold:#C9A876; --gold-soft:#9C8159; --plate:#141311; --plate-ink:#E6E1D8;
  --ok:#7DBB98; --ko:#D58A8A;
  --tok-c:#7D776E; --tok-k:#C7A0D1; --tok-s:#9CC9A9; --tok-n:#D9B98A; --tok-f:#9DBFE0; --tok-t:#E09A9A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F0E0D; --paper-2:#171614; --ink:#EDE9E2; --ink-2:#B5AFA5; --ink-3:#7D776E;
  --line:#2C2925; --gold:#C9A876; --gold-soft:#9C8159; --plate:#141311; --plate-ink:#E6E1D8;
  --ok:#7DBB98; --ko:#D58A8A;
  --tok-c:#7D776E; --tok-k:#C7A0D1; --tok-s:#9CC9A9; --tok-n:#D9B98A; --tok-f:#9DBFE0; --tok-t:#E09A9A;
  color-scheme:dark}

/* ── Collection “Jardin”: a mother-of-pearl garden (light) / a moonlit garden (dark) ── */
:root[data-collection="jardin"]{
  --paper:#FAF8F5; --paper-2:#F0EEF1; --ink:#1C2737; --ink-2:#4C5668; --ink-3:#8790A0;
  --line:#DCD8E0; --gold:#2B7C7C; --gold-soft:#7FB7B2; --plate:#FFFFFF; --plate-ink:#1C2737;
  --ok:#2F6B4F; --ko:#A0476A;
  --tok-c:#8790A0; --tok-k:#6B4FA0; --tok-s:#2B7C7C; --tok-n:#A07D45; --tok-f:#2D4E8A; --tok-t:#A0476A;
  --display:"Cormorant Garamond","Cormorant",Garamond,Georgia,serif;
  --velvet:#F7F4F0; --velvet-2:#E6F2F1; --pearl:#1C2737; --pearl-2:#4C5668; --pearl-3:#7C8696; --champagne:#A9864F;
  --em-grad:linear-gradient(100deg,#2B7C7C 0%,#7C6FB0 30%,#C08A9E 55%,#A9864F 80%,#2B7C7C 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 62%,rgba(255,255,255,.6) 100%);
  --ring:rgba(28,39,55,.14); --ghost-line:rgba(28,39,55,.3); --code-bg-hero:rgba(28,39,55,.06);
  --gem-hi:#E8F6F4; --gem-lo:#1F5E5E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-collection="jardin"]{
  --paper:#0D1320; --paper-2:#141C2C; --ink:#E9EEF2; --ink-2:#AEB8C6; --ink-3:#768195;
  --line:#243045; --gold:#7FD1C7; --gold-soft:#4E8E89; --plate:#111827; --plate-ink:#E4EAF0;
  --ok:#7DBB98; --ko:#F0A6C0;
  --tok-c:#768195; --tok-k:#C3B0F0; --tok-s:#8FD8CC; --tok-n:#E3C88F; --tok-f:#9DBFE8; --tok-t:#F0A6C0;
  --velvet:#0A1120; --velvet-2:#14304A; --pearl:#EEF3F5; --pearl-2:#B4C0CC; --pearl-3:#7E8B9C; --champagne:#E3C88F;
  --em-grad:linear-gradient(100deg,#8FD8CC 0%,#B9A8F0 30%,#F0B8CC 55%,#E3C88F 80%,#8FD8CC 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);
  --ring:rgba(238,243,245,.14); --ghost-line:rgba(238,243,245,.35); --code-bg-hero:rgba(255,255,255,.07);
  color-scheme:dark}}
:root[data-theme="dark"][data-collection="jardin"]{
  --paper:#0D1320; --paper-2:#141C2C; --ink:#E9EEF2; --ink-2:#AEB8C6; --ink-3:#768195;
  --line:#243045; --gold:#7FD1C7; --gold-soft:#4E8E89; --plate:#111827; --plate-ink:#E4EAF0;
  --ok:#7DBB98; --ko:#F0A6C0;
  --tok-c:#768195; --tok-k:#C3B0F0; --tok-s:#8FD8CC; --tok-n:#E3C88F; --tok-f:#9DBFE8; --tok-t:#F0A6C0;
  --velvet:#0A1120; --velvet-2:#14304A; --pearl:#EEF3F5; --pearl-2:#B4C0CC; --pearl-3:#7E8B9C; --champagne:#E3C88F;
  --em-grad:linear-gradient(100deg,#8FD8CC 0%,#B9A8F0 30%,#F0B8CC 55%,#E3C88F 80%,#8FD8CC 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);
  --ring:rgba(238,243,245,.14); --ghost-line:rgba(238,243,245,.35); --code-bg-hero:rgba(255,255,255,.07);
  color-scheme:dark}

/* ── Collection “Calibre”: fine watchmaking — opaline dial (light) / midnight enamel (dark) ── */
:root[data-collection="calibre"]{
  --paper:#F4F5F5; --paper-2:#E9EBED; --ink:#14202E; --ink-2:#4A5563; --ink-3:#87909B;
  --line:#D3D7DC; --gold:#1F4E8C; --gold-soft:#7D9CC4; --plate:#FFFFFF; --plate-ink:#14202E;
  --ok:#2F6B4F; --ko:#A3322F;
  --tok-c:#87909B; --tok-k:#1F4E8C; --tok-s:#2F6B4F; --tok-n:#B07A5A; --tok-f:#5A3E8C; --tok-t:#A3322F;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --velvet:#E6E9EC; --velvet-2:#FBFBFB; --pearl:#13202F; --pearl-2:#4A5563; --pearl-3:#7E8894; --champagne:#B07A5A;
  --em-grad:linear-gradient(100deg,#1F4E8C 0%,#4C7CC0 25%,#162F57 50%,#3E6FB0 75%,#1F4E8C 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 60%,rgba(20,32,47,.10) 100%);
  --ring:rgba(20,32,47,.16); --ghost-line:rgba(20,32,47,.3); --code-bg-hero:rgba(20,32,47,.06);
  --gem-hi:#DCE7F5; --gem-lo:#162F57;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-collection="calibre"]{
  --paper:#0B111B; --paper-2:#121A27; --ink:#E7EBF0; --ink-2:#A9B3C0; --ink-3:#707B8A;
  --line:#222C3B; --gold:#D9A989; --gold-soft:#9C7560; --plate:#0F1622; --plate-ink:#E3E8EE;
  --ok:#7DBB98; --ko:#E39A93;
  --tok-c:#707B8A; --tok-k:#8FB2E8; --tok-s:#9CC9A9; --tok-n:#D9A989; --tok-f:#C3B0F0; --tok-t:#E39A93;
  --velvet:#070C16; --velvet-2:#16264A; --pearl:#EEF1F5; --pearl-2:#A9B3C0; --pearl-3:#7A8595; --champagne:#D9A989;
  --em-grad:linear-gradient(100deg,#D9A989 0%,#F3D2BC 25%,#B07A5A 50%,#EBC2A6 75%,#D9A989 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);
  --ring:rgba(238,241,245,.14); --ghost-line:rgba(238,241,245,.35); --code-bg-hero:rgba(255,255,255,.07);
  --gem-hi:#F3D2BC; --gem-lo:#6E4A36;
  color-scheme:dark}}
:root[data-theme="dark"][data-collection="calibre"]{
  --paper:#0B111B; --paper-2:#121A27; --ink:#E7EBF0; --ink-2:#A9B3C0; --ink-3:#707B8A;
  --line:#222C3B; --gold:#D9A989; --gold-soft:#9C7560; --plate:#0F1622; --plate-ink:#E3E8EE;
  --ok:#7DBB98; --ko:#E39A93;
  --tok-c:#707B8A; --tok-k:#8FB2E8; --tok-s:#9CC9A9; --tok-n:#D9A989; --tok-f:#C3B0F0; --tok-t:#E39A93;
  --velvet:#070C16; --velvet-2:#16264A; --pearl:#EEF1F5; --pearl-2:#A9B3C0; --pearl-3:#7A8595; --champagne:#D9A989;
  --em-grad:linear-gradient(100deg,#D9A989 0%,#F3D2BC 25%,#B07A5A 50%,#EBC2A6 75%,#D9A989 100%);
  --vignette:radial-gradient(70% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);
  --ring:rgba(238,241,245,.14); --ghost-line:rgba(238,241,245,.35); --code-bg-hero:rgba(255,255,255,.07);
  --gem-hi:#F3D2BC; --gem-lo:#6E4A36;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;font-size:1.0625rem;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--gold);color:var(--paper)}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
code{font-family:var(--mono);font-size:.84em;background:var(--paper-2);padding:.08em .35em;border-radius:2px}
.eyebrow{font-family:var(--body);font-weight:500;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--ink-2)}

/* ── Top bar ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:80rem;margin:0 auto;padding-inline:1.25rem;height:3.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.mark{display:flex;align-items:baseline;gap:.6rem;text-decoration:none}
.mark b{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.02em}
.mark span{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:1.25rem}
.lang{display:flex;gap:.15rem}
.lang button,.theme{font:500 .72rem/1 var(--body);letter-spacing:.2em;background:none;border:0;color:var(--ink-3);padding:.5rem .45rem;cursor:pointer;text-transform:uppercase}
.lang button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--gold)}
.lang button:hover,.theme:hover{color:var(--ink)}
.theme{letter-spacing:.12em}

/* ── Hero ── */
.showcase{position:relative;background:radial-gradient(120% 90% at 70% 0%,var(--velvet-2) 0%,var(--velvet) 62%);color:var(--pearl);overflow:hidden;isolation:isolate}
.showcase::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--vignette);z-index:1}
[data-collection="jardin"] .showcase{background:
  radial-gradient(55% 50% at 18% 22%,rgba(185,168,240,.28),transparent 70%),
  radial-gradient(50% 60% at 86% 28%,rgba(127,209,199,.32),transparent 70%),
  radial-gradient(70% 60% at 60% 105%,rgba(240,184,204,.30),transparent 70%),
  linear-gradient(160deg,var(--velvet-2),var(--velvet));background-size:180% 180%,180% 180%,180% 180%,100% 100%;animation:nacre 22s ease-in-out infinite alternate}
@keyframes nacre{0%{background-position:0% 0%,100% 0%,50% 100%,0 0}100%{background-position:30% 20%,70% 30%,40% 70%,0 0}}
#garden,#bloom,#movement,#tourbillon{display:none}
[data-collection="calibre"] #movement{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;cursor:crosshair}
[data-collection="calibre"] #tourbillon{display:block;position:absolute;left:10%;top:10%;width:80%;height:80%}
[data-collection="calibre"] .showcase{background:
  repeating-conic-gradient(from 0deg at 74% 50%,rgba(255,255,255,.06) 0deg .5deg,rgba(0,0,0,.015) .5deg 1deg),
  radial-gradient(85% 75% at 74% 50%,var(--velvet-2) 0%,var(--velvet) 75%)}
[data-collection="calibre"] .hero h1{letter-spacing:.005em;line-height:1.02}
[data-collection="calibre"] .hero h1 em{font-style:normal}
[data-collection="calibre"] h1,[data-collection="calibre"] h2,[data-collection="calibre"] h3{font-weight:400}
[data-collection="jardin"] #garden{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;cursor:crosshair}
[data-collection="jardin"] #bloom{display:block;position:absolute;left:12%;top:12%;width:76%;height:76%}
[data-collection="jardin"] .hero h1{font-weight:400;letter-spacing:-.005em}
.hero{position:relative;z-index:2;max-width:80rem;margin:0 auto;padding:clamp(3.5rem,9vw,7.5rem) 1.25rem clamp(3.5rem,7vw,6rem);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(2rem,5vw,5rem);align-items:center;pointer-events:none}
.hero a,.hero button{pointer-events:auto}
.hero .eyebrow{color:var(--champagne)}
.hero h1{font-size:clamp(2.9rem,8.4vw,6.6rem);line-height:.98;margin-top:1.4rem;color:var(--pearl)}
.hero h1 em{font-style:italic;background:var(--em-grad);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero .lede{margin-top:2rem;max-width:36rem;font-size:1.15rem;color:var(--pearl-2)}
.hero .lede code{background:var(--code-bg-hero);color:var(--pearl)}
.hero-cta{margin-top:2.5rem;display:flex;flex-wrap:wrap;gap:1rem}
.btn{display:inline-flex;align-items:center;gap:.7rem;font:500 .74rem/1 var(--body);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;padding:1.05rem 1.6rem;border:1px solid var(--pearl);transition:background .3s,color .3s,border-color .3s}
.btn.solid{background:var(--pearl);color:var(--velvet)}
.btn.solid:hover{background:transparent;color:var(--pearl)}
.btn.ghost{color:var(--pearl);border-color:var(--ghost-line)}
.btn.ghost:hover{border-color:var(--champagne);color:var(--champagne)}
.hint{margin-top:2.2rem;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--pearl-3)}
.hallmark{justify-self:end;width:min(100%,21rem);margin:0;position:relative}
.hallmark svg{width:100%;height:auto;display:block}
.hallmark figcaption{margin-top:1.1rem;text-align:center;display:grid;gap:.35rem}
.hallmark figcaption b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--pearl);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hallmark figcaption b small{font-family:var(--mono);font-size:.68rem;color:var(--pearl-3);letter-spacing:.06em;margin-left:.5rem}
.hallmark figcaption span{font-size:.82rem;color:var(--pearl-3);letter-spacing:.04em}
.ring{transform-origin:150px 150px;animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.18s}.rise.d3{animation-delay:.3s}
@keyframes rise{from{transform:translateY(14px);opacity:.001}to{transform:none;opacity:1}}

/* ── Frame ── */
.frame{max-width:80rem;margin:0 auto;padding-inline:1.25rem;display:grid;grid-template-columns:14rem minmax(0,1fr);gap:clamp(2rem,5vw,5rem)}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 5.5rem);align-self:start;padding-block:3.5rem}
.index ol{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.index a{display:grid;grid-template-columns:2.4rem 1fr;align-items:baseline;text-decoration:none;color:var(--ink-3);padding:.45rem 0;font-size:.92rem;transition:color .25s}
.index a i{font-family:var(--display);font-style:italic;font-size:.95rem}
.index a:hover,.index a.on{color:var(--ink)}
.index a.on i{color:var(--gold)}
.index .prog{margin-top:2rem;height:1px;background:var(--line);position:relative}
.index .prog span{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0;transition:width .2s}
.index .prog span::after{content:"";position:absolute;right:-4px;top:-4px;width:8px;height:9px;background:var(--gold);clip-path:polygon(25% 0,75% 0,100% 30%,50% 100%,0 30%)}
main{min-width:0;padding-block:1rem 6rem}

/* ── Chapters ── */
.chapter{padding-top:clamp(3.5rem,7vw,6rem);border-bottom:1px solid var(--line);padding-bottom:clamp(3.5rem,7vw,6rem)}
.chapter:last-child{border-bottom:0}
.ch-head{display:grid;gap:1rem;margin-bottom:2.5rem;max-width:var(--measure)}
.ch-num{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
.chapter h2{font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.05}
.chapter h3{font-size:1.55rem;line-height:1.2}
.prose{max-width:var(--measure);display:grid;gap:1.15rem;color:var(--ink-2)}
.prose strong{color:var(--ink);font-weight:500}

/* Pyramid */
.pyr{margin-top:3rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.5rem;align-items:stretch}
.pyr svg{width:100%;height:auto;display:block}
.pyr svg text{font-family:var(--body);fill:var(--ink)}
/* rows follow the SVG bands (viewBox 320 high: 18 margin, 94, 8, 86, 8, 88, 18) so each text sits beside its band */
.tiers{display:grid;grid-template-rows:18fr 94fr 8fr 86fr 8fr 88fr 18fr;align-items:center}
.tiers .tier:nth-child(1){grid-row:2}.tiers .tier:nth-child(2){grid-row:4}.tiers .tier:nth-child(3){grid-row:6}
.tier{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:baseline}
.tier b{font-family:var(--display);font-weight:400;font-style:italic;color:var(--gold);font-size:1.1rem;min-width:1.8rem}
.tier h4{margin:0;font:500 .78rem/1.3 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.tier p{font-size:.95rem;color:var(--ink-2);margin-top:.25rem}

/* Tool register */
.register{margin-top:3.5rem;border-top:1px solid var(--ink)}
.register-row{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:1.5rem;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.register-row dt{font-family:var(--mono);font-size:.85rem;color:var(--ink)}
.register-row dd{margin:0;color:var(--ink-2);font-size:.97rem}

/* Concepts */
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.concept{padding:1.75rem 1.6rem 1.9rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:.8rem;align-content:start;min-width:0;transition:background .3s}
.concept:hover{background:var(--paper-2)}
.concept .k{font-family:var(--mono);font-size:.78rem;color:var(--gold)}
.concept h3{font-size:1.3rem}
.concept p{font-size:.95rem;color:var(--ink-2)}

/* Anatomy */
.anatomy{display:grid;grid-template-columns:minmax(0,19rem) minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--plate)}
.tree{padding:1.4rem 0;border-right:1px solid var(--line);font-family:var(--mono);font-size:.82rem;overflow-x:auto}

.tree button[aria-selected="true"]{color:var(--ink);background:var(--paper-2);box-shadow:inset 2px 0 0 var(--gold)}
.tree .dir{display:block;padding:.32rem 1.2rem;white-space:pre;color:var(--ink-3)}
.tree button.dir:hover{color:var(--ink)}
.tree .chev{font-style:normal;display:inline-block;width:1.1em;color:var(--gold)}
.tree .cnt{font-family:var(--body);font-size:.62rem;color:var(--ink-3);margin-left:.6rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem}
.tree .root{color:var(--ink-2)}
.tree-tools{display:flex;gap:1rem;padding:0 1.2rem .8rem;margin-bottom:.5rem;border-bottom:1px solid var(--line)}
.tree .tree-tools button{all:unset;cursor:pointer;width:auto;padding:.2rem 0;font:500 .62rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid transparent}
.tree .tree-tools button:hover{color:var(--gold);border-bottom-color:var(--gold);background:none}
.tree .tag{font-family:var(--body);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-left:.5rem}
.detail{padding:1.8rem 1.8rem 2rem;min-width:0;display:grid;gap:1rem;align-content:start}
.detail .path{font-family:var(--mono);font-size:.8rem;color:var(--gold)}
.detail h3{font-size:1.6rem}
.detail p{color:var(--ink-2);font-size:.97rem;max-width:40rem}

/* Code plate */
.plate{position:relative;border:1px solid var(--line);background:var(--plate);min-width:0}
.plate-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem .9rem .6rem 1.1rem;border-bottom:1px solid var(--line)}
.plate-head span{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{font:500 .66rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink-2);padding:.5rem .7rem;cursor:pointer;flex:none}
.copy:hover{border-color:var(--gold);color:var(--ink)}
.plate pre{margin:0;padding:1.1rem 1.2rem 1.3rem;overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.7;color:var(--plate-ink);tab-size:4;max-height:34rem}
.plate pre code{background:none;padding:0;font-size:inherit}
.detail .plate pre{max-height:26rem}
.token.comment,.token.prolog,.token.doctype{color:var(--tok-c);font-style:italic}
.token.keyword,.token.boolean,.token.important{color:var(--tok-k)}
.token.string,.token.attr-value,.token.template-string{color:var(--tok-s)}
.token.number,.token.key,.token.atrule{color:var(--tok-n)}
.token.function,.token.class-name{color:var(--tok-f)}
.token.tag,.token.selector{color:var(--tok-t)}
.token.attr-name,.token.property{color:var(--tok-n)}
.token.punctuation,.token.operator{color:var(--ink-3)}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:1.5rem;padding:2.6rem 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step-n{font-family:var(--display);font-size:2.6rem;line-height:.9;color:var(--gold);font-style:italic}
.step-body{display:grid;gap:1.1rem;min-width:0}
.step-body h3{font-size:1.65rem}
.step-body p{color:var(--ink-2);max-width:var(--measure)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{font-family:var(--mono);font-size:.74rem;color:var(--ink-2);border:1px solid var(--line);padding:.2rem .55rem}
.note{border-left:1px solid var(--gold);padding:.2rem 0 .2rem 1.1rem;font-size:.93rem;color:var(--ink-2);max-width:var(--measure)}
.note b{font-weight:500;color:var(--ink)}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:.25rem 1.6rem;border-bottom:1px solid var(--line);margin-bottom:2rem}
.tabs button{all:unset;cursor:pointer;padding:.85rem 0;font:500 .72rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);box-shadow:inset 0 0 0 transparent;transition:color .25s,box-shadow .25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--gold)}
.tabs button:focus-visible{outline:1px solid var(--gold)}
.panel{display:grid;gap:1.3rem;min-width:0}
.panel h3{font-size:1.75rem}
.panel p{color:var(--ink-2);max-width:var(--measure)}

/* Practices */
.ledger{display:grid;gap:0;border-top:1px solid var(--ink);max-width:52rem}
.ledger label{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:1rem;padding:1.05rem 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.ledger input{appearance:none;-webkit-appearance:none;width:1.15rem;height:1.2rem;margin:.25rem 0 0;display:grid;place-content:center;cursor:pointer;background:var(--ink-3);clip-path:polygon(25% 0,75% 0,100% 30%,50% 100%,0 30%);position:relative;transition:background .3s}
.ledger input::before{content:"";position:absolute;inset:1px;background:var(--paper);clip-path:polygon(25% 0,75% 0,100% 30%,50% 100%,0 30%)}
.ledger input::after{content:"";position:relative;width:.75rem;height:.8rem;background:linear-gradient(135deg,var(--gem-hi),var(--gold) 55%,var(--gem-lo));clip-path:polygon(25% 0,75% 0,100% 30%,50% 100%,0 30%);transform:scale(0) rotate(-30deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.ledger input:checked{background:var(--gold)}
.ledger input:checked::after{transform:none}
.ledger input:focus-visible{outline:none;background:var(--ink)}
.ledger b{font-weight:500;color:var(--ink);display:block}
.ledger span{color:var(--ink-2);font-size:.95rem}
.ledger-meta{display:flex;justify-content:space-between;align-items:baseline;max-width:52rem;margin-bottom:1rem;gap:1rem;flex-wrap:wrap}
.ledger-meta .count{font-family:var(--display);font-size:2.2rem;font-variant-numeric:tabular-nums}
.ledger-meta .count small{font-size:1rem;color:var(--ink-3)}
.reset{font:500 .68rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:.4rem 0}
.reset:hover{color:var(--ink)}
.pairs{margin-top:4rem;display:grid;gap:1.5rem}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line)}
.pair>div{padding:1.4rem 1.5rem;display:grid;gap:.5rem;align-content:start;min-width:0}
.pair>div+div{border-left:1px solid var(--line)}
.pair .lbl{font:500 .66rem/1 var(--body);letter-spacing:.24em;text-transform:uppercase}
.pair .no .lbl{color:var(--ko)}
.pair .yes .lbl{color:var(--ok)}
.pair p{font-size:.95rem;color:var(--ink-2)}



/* Step file sets + generator table */
.fileset{display:grid;gap:0;min-width:0}
.fs-tabs{display:flex;flex-wrap:wrap;gap:0 1.1rem;border:1px solid var(--line);border-bottom:0;padding:.2rem .9rem 0;background:var(--paper-2)}
.fs-tabs button{all:unset;cursor:pointer;font-family:var(--mono);font-size:.74rem;color:var(--ink-3);padding:.6rem 0 .5rem;box-shadow:inset 0 0 0 transparent}
.fs-tabs button:hover{color:var(--ink)}
.fs-tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--gold)}
.fs-tabs button:focus-visible{outline:1px solid var(--gold)}
.kv-wrap{overflow-x:auto;max-width:var(--measure)}
.kv{width:100%;border-collapse:collapse;border-top:1px solid var(--ink);font-size:.92rem}
.kv th,.kv td{text-align:left;padding:.6rem .8rem .6rem 0;border-bottom:1px solid var(--line);vertical-align:top}
.kv th{font:500 .66rem/1.4 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);width:12rem}
.kv td code{overflow-wrap:anywhere}
.step-link{justify-self:start;font:500 .68rem/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);background:none;border:0;border-bottom:1px solid var(--line);padding:.3rem 0;cursor:pointer}
button.step-link:hover{border-bottom-color:var(--gold)}
.step{scroll-margin-top:5rem}
.detail,.step-body,.fileset{grid-template-columns:minmax(0,1fr)}
.detail .path,.chip{overflow-wrap:anywhere}


/* Collection switcher + reveal transition */
.collection{display:flex;gap:.15rem;padding:.2rem;border:1px solid var(--line);border-radius:999px}
.collection button{display:flex;align-items:center;gap:.5rem;font:500 .66rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;background:none;border:0;border-radius:999px;color:var(--ink-3);padding:.4rem .75rem .4rem .45rem;cursor:pointer;transition:background .3s,color .3s}
.collection button:hover{color:var(--ink)}
.collection button[aria-pressed="true"]{background:var(--paper-2);color:var(--ink)}
.sw{width:1.05rem;height:1.05rem;border-radius:50%;flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.sw-j{background:conic-gradient(from 30deg,#E6F2F1,#B9A8F0,#F0B8CC,#F6E7C8,#8FD8CC,#E6F2F1)}
.sw-c{background:repeating-conic-gradient(#1F4E8C 0deg 6deg,#2D5FA3 6deg 12deg)}
.sw-c::after{content:"";position:absolute;left:50%;top:50%;width:.3rem;height:.3rem;border-radius:50%;transform:translate(-50%,-50%);background:#D9A989;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
@media (max-width:680px){.sw-l{display:none}.collection button{padding:.4rem}.tools{gap:.5rem}.mark b{font-size:1.1rem;white-space:nowrap}.lang button,.theme{padding:.5rem .3rem;letter-spacing:.12em}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:collection-reveal 1.15s cubic-bezier(.65,0,.25,1)}
@keyframes collection-reveal{from{clip-path:circle(0px at var(--vt-x,90%) var(--vt-y,2rem))}to{clip-path:circle(170vmax at var(--vt-x,90%) var(--vt-y,2rem))}}

/* Glossary */
.g-compare{margin-bottom:3.5rem;max-width:56rem}
.g-compare h3{font-size:1.45rem;margin-bottom:1.2rem}
.g-table-wrap{overflow-x:auto;border-top:1px solid var(--ink)}
.g-table{width:100%;border-collapse:collapse;min-width:34rem;font-size:.9rem}
.g-table th,.g-table td{padding:.85rem .8rem;border-bottom:1px solid var(--line);text-align:center;font-weight:400}
.g-table thead th{font:500 .66rem/1.35 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);vertical-align:bottom}
.g-table th[scope="row"]{text-align:left;font-family:var(--display);font-size:1.15rem;padding-left:0}
.g-table th[scope="row"] button{all:unset;cursor:pointer;border-bottom:1px solid transparent}
.g-table th[scope="row"] button:hover{border-color:var(--gold)}
.gem{display:inline-block;width:.8rem;height:.85rem;clip-path:polygon(25% 0,75% 0,100% 30%,50% 100%,0 30%);vertical-align:middle}
.gem.y{background:linear-gradient(135deg,var(--gem-hi),var(--gold) 55%,var(--gem-lo))}
.gem.n{background:var(--line)}
.g-tools{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;align-items:center;margin-bottom:1.2rem}
.g-search{flex:1 1 16rem;min-width:0;position:relative}
.g-search input{width:100%;font:300 1.05rem var(--body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink-3);padding:.7rem 0 .6rem 1.8rem;border-radius:0}
.g-search input:focus{outline:none;border-bottom-color:var(--gold)}
.g-search input::placeholder{color:var(--ink-3)}
.g-search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:1.05rem;height:1.05rem;stroke:var(--ink-3);fill:none}
.g-cats{display:flex;flex-wrap:wrap;gap:.4rem}
.g-cats button{font:500 .68rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink-2);padding:.55rem .8rem;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.g-cats button:hover{border-color:var(--gold);color:var(--ink)}
.g-cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.g-letters{display:flex;flex-wrap:wrap;gap:.1rem;margin-bottom:2rem;font-family:var(--display);font-size:1.05rem}
.g-letters button{all:unset;cursor:pointer;width:1.9rem;text-align:center;padding:.3rem 0;color:var(--ink-2)}
.g-letters button:hover{color:var(--gold)}
.g-letters button:disabled{color:var(--line);cursor:default}
.g-letters button:focus-visible{outline:1px solid var(--gold)}
.g-count{font-size:.8rem;color:var(--ink-3);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.g-list{border-top:1px solid var(--ink)}
.g-letter{font-family:var(--display);font-style:italic;color:var(--gold);font-size:2.2rem;line-height:1;padding:1.6rem 0 .4rem}
.g-entry{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:1rem 2.5rem;padding:1.8rem 0;border-bottom:1px solid var(--line);scroll-margin-top:6rem;transition:background .8s}

.g-term em{font-family:var(--display);color:var(--ink-2);font-size:1rem}
.g-tag{justify-self:start;font:500 .62rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:.35rem .5rem;margin-top:.3rem}
.g-body{display:grid;gap:1rem;min-width:0;max-width:var(--measure)}
.g-body h4{margin:0 0 .2rem;font:500 .66rem/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.g-body p{color:var(--ink-2);font-size:.98rem}
.g-body .plate pre{font-size:.76rem;padding:.8rem 1rem;max-height:none}
.g-rel{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.g-rel span{font:500 .62rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-right:.3rem}
.g-rel button{font-family:var(--mono);font-size:.74rem;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:.15rem 0;margin-right:.6rem;cursor:pointer}
.g-rel button:hover{border-bottom-color:var(--gold);color:var(--gold)}
.g-empty{padding:2rem 0;color:var(--ink-3)}

/* References */

<textarea class="src" id="p-webapp-Component-js">sap.ui.define(["sap/ui/core/UIComponent", "sap/ui/Device", "./model/models"], function (UIComponent, Device, models) {
	"use strict";

	return UIComponent.extend("com.training.orders.Component", {
		metadata: {
			manifest: "json",
			interfaces: ["sap.ui.core.IAsyncContentCreation"]
		},

		init: function () {
			UIComponent.prototype.init.apply(this, arguments);
			this.setModel(models.createDeviceModel(), "device");
			this.getRouter().initialize();
		},

		/**
		 * @public
		 * @returns {string} css class for content density
		 */
		getContentDensityClass: function () {
			if (this.contentDensityClass === undefined) {
				if (document.body.classList.contains("sapUiSizeCozy") || document.body.classList.contains("sapUiSizeCompact")) {
					this.contentDensityClass = "";
				} else if (!Device.support.touch) {
					this.contentDensityClass = "sapUiSizeCompact";
				} else {
					this.contentDensityClass = "sapUiSizeCozy";
				}
			}
			return this.contentDensityClass;
		}
	});
});</textarea>

<textarea class="src" id="p-webapp-controller-BaseController-js">sap.ui.define(["sap/ui/core/mvc/Controller", "sap/ui/core/UIComponent", "sap/ui/core/routing/History"], function (Controller, UIComponent, History) {
	"use strict";

	return Controller.extend("com.training.orders.controller.BaseController", {
		getRouter: function () {
			return UIComponent.getRouterFor(this);
		},

		getResourceBundle: function () {
			return this.getOwnerComponent().getModel("i18n").getResourceBundle();
		},

		/**
		 * Caches the async i18n bundle the first time it resolves.
		 * @returns {Promise&lt;sap.base.i18n.ResourceBundle&gt;} resource bundle promise
		 */
		_loadResourceBundle: function () {
			if (!this._oResourceBundlePromise) {
				this._oResourceBundlePromise = Promise.resolve(this.getResourceBundle()).then((oBundle) =&gt; {
					this._oResourceBundle = oBundle;
					return oBundle;
				});
			}
			return this._oResourceBundlePromise;
		},

		getModel: function (sName) {
			return this.getView().getModel(sName);
		},

		setModel: function (oModel, sName) {
			this.getView().setModel(oModel, sName);
			return this;
		},

		navTo: function (sName, oParameters, bReplace) {
			this.getRouter().navTo(sName, oParameters, undefined, bReplace);
		},

		onNavBack: function () {
			const sPreviousHash = History.getInstance().getPreviousHash();
			if (sPreviousHash !== undefined) {
				window.history.go(-1);
			} else {
				this.getRouter().navTo("worklist", {}, undefined, true);
			}
		},

		/**
		 * @param {string} sKey i18n key
		 * @param {Array} [aArgs] placeholders
		 * @returns {string} translated text
		 */
		_getText: function (sKey, aArgs) {
			if (this._oResourceBundle) {
				return this._oResourceBundle.getText(sKey, aArgs);
			}
			// Fire-and-forget load for subsequent sync calls; return key until ready
			this._loadResourceBundle();
			return sKey;
		}
	});
});</textarea>
<textarea class="src" id="p-webapp-controller-Detail-controller-js">sap.ui.define(
	["./BaseController", "../model/formatter", "../model/models", "sap/m/MessageBox"],
	function (BaseController, formatter, models, MessageBox) {
		"use strict";

		return BaseController.extend("com.training.orders.controller.Detail", {
			formatter: formatter,

			onInit: function () {
				this.setModel(models.createViewModel({ busy: true }), "detailView");
				this.getRouter().getRoute("detail").attachPatternMatched(this._onObjectMatched, this);
			},

			_onObjectMatched: function (oEvent) {
				const sOrderId = oEvent.getParameter("arguments").orderId;
				this._bindView("/Orders(" + sOrderId + ")");
			},

			/**
			 * @param {string} sObjectPath absolute OData path
			 */
			_bindView: function (sObjectPath) {
				const oViewModel = this.getModel("detailView");
				oViewModel.setProperty("/busy", true);

				this.getView().bindElement({
					path: sObjectPath,
					parameters: {
						expand: "Order_Details"
					},
					events: {
						change: this._onBindingChange.bind(this),
						dataRequested: function () {
							oViewModel.setProperty("/busy", true);
						},
						dataReceived: function () {
							oViewModel.setProperty("/busy", false);
						}
					}
				});
			},

			/**
			 * Shows the worklist and an error when the order does not exist.
			 * @returns {Promise&lt;void&gt;} resolved once any error message was shown
			 */
			_onBindingChange: function () {
				const oView = this.getView();
				const oElementBinding = oView.getElementBinding();
				const oViewModel = this.getModel("detailView");

				if (!oElementBinding.getBoundContext()) {
					oViewModel.setProperty("/busy", false);
					this.getRouter().getTargets().display("worklist");
					return this._loadResourceBundle().then((oBundle) =&gt; {
						MessageBox.error(oBundle.getText("detailNotFound"));
					});
				}

				oViewModel.setProperty("/busy", false);
				return Promise.resolve();
			}
		});
	}
);</textarea>
<textarea class="src" id="p-webapp-controller-Worklist-controller-js">sap.ui.define(
	[
		"./BaseController",
		"../model/formatter",
		"../model/models",
		"sap/ui/model/Filter",
		"sap/ui/model/FilterOperator",
		"sap/ui/model/Sorter",
		"sap/m/MessageToast"
	],
	function (BaseController, formatter, models, Filter, FilterOperator, Sorter, MessageToast) {
		"use strict";

		return BaseController.extend("com.training.orders.controller.Worklist", {
			formatter: formatter,

			onInit: function () {
				this.setModel(models.createViewModel(), "worklistView");
				this.getRouter().getRoute("worklist").attachPatternMatched(this._onRouteMatched, this);
			},

			_onRouteMatched: function () {
				this._updateListBinding();
			},

			/**
			 * Live search with 300 ms debounce (exercises Sinon fake timers in unit tests).
			 * @param {sap.ui.base.Event} oEvent search field event
			 */
			onSearch: function (oEvent) {
				const sQuery = oEvent.getParameter("query") || oEvent.getParameter("newValue") || "";
				clearTimeout(this._iSearchTimer);
				this._iSearchTimer = setTimeout(() =&gt; {
					this._applySearch(sQuery);
				}, 300);
			},

			/**
			 * @param {string} sQuery search text
			 */
			_applySearch: function (sQuery) {
				const aFilters = [];
				const sValue = (sQuery || "").trim();
				if (sValue) {
					const aOr = [
						new Filter("CustomerID", FilterOperator.Contains, sValue),
						new Filter("ShipName", FilterOperator.Contains, sValue),
						new Filter("ShipCity", FilterOperator.Contains, sValue),
						new Filter("ShipCountry", FilterOperator.Contains, sValue)
					];
					if (!Number.isNaN(Number(sValue))) {
						aOr.unshift(new Filter("OrderID", FilterOperator.EQ, Number(sValue)));
					}
					aFilters.push(new Filter({ filters: aOr, and: false }));
				}
				this._oListFilter = aFilters;
				this._updateListBinding();
			},

			_updateListBinding: function () {
				const oTable = this.byId("ordersTable");
				if (!oTable) {
					return;
				}
				const oBinding = oTable.getBinding("items");
				if (oBinding) {
					oBinding.filter(this._oListFilter || []);
				}
			},

			onSort: function () {
				const oTable = this.byId("ordersTable");
				const oBinding = oTable &amp;&amp; oTable.getBinding("items");
				if (!oBinding) {
					return;
				}
				const bDescending = !this._bSortDescending;
				this._bSortDescending = bDescending;
				oBinding.sort(new Sorter("OrderID", bDescending));
			},

			/**
			 * Refreshes the list and confirms with a toast.
			 * Returns the Promise so that callers and unit tests can await the outcome.
			 * @returns {Promise&lt;void&gt;} resolved once the toast was shown
			 */
			onRefresh: function () {
				const oTable = this.byId("ordersTable");
				const oBinding = oTable &amp;&amp; oTable.getBinding("items");
				if (!oBinding) {
					return Promise.resolve();
				}
				oBinding.refresh();
				return this._loadResourceBundle().then((oBundle) =&gt; {
					MessageToast.show(oBundle.getText("worklistRefreshed"));
				});
			},

			/**
			 * Navigate to the freestyle overview/detail page.
			 * @param {sap.ui.base.Event} oEvent list item press
			 */
			onPressOrder: function (oEvent) {
				const oItem = oEvent.getSource();
				const oCtx = oItem.getBindingContext();
				const sOrderId = oCtx.getProperty("OrderID");
				this.navTo("detail", {

<textarea class="src" id="p-webapp-localService-mockserver-js">sap.ui.define(["require", "sap/ui/core/util/MockServer", "sap/base/Log"], function (require, MockServer, Log) {
	"use strict";

	let oMockServer;
	// Must match sap.app.dataSources.mainService.uri in manifest.json
	const sRootUri = "/V2/Northwind/Northwind.svc/";

	return {
		/**
		 * Initializes the mock server for OPA5 / local tests.
		 * Paths are resolved relative to this file, so it works for any app namespace.
		 * @returns {sap.ui.core.util.MockServer} started mock server
		 */
		init: function () {
			if (oMockServer) {
				return oMockServer;
			}

			const oUriParameters = new URLSearchParams(window.location.search);
			const iDelay = parseInt(oUriParameters.get("serverDelay") || "100", 10);
			const sMetadataUrl = require.toUrl("./mainService/metadata.xml");
			const sMockdataUrl = require.toUrl("./mockdata");

			oMockServer = new MockServer({
				rootUri: sRootUri
			});

			MockServer.config({
				autoRespond: true,
				autoRespondAfter: iDelay
			});

			oMockServer.simulate(sMetadataUrl, {
				sMockdataBaseUrl: sMockdataUrl,
				// only the entity sets the app uses (avoids loading ~50 missing JSON files)
				aEntitySetsNames: ["Orders", "Order_Details"],
				bGenerateMissingMockData: true
			});

			oMockServer.start();
			Log.info("Running the app with mock data for " + sRootUri + " (metadata: " + sMetadataUrl + ")");
			return oMockServer;
		},

		getMockServer: function () {
			return oMockServer;
		}
	};
});</textarea>

<textarea class="src" id="p-webapp-model-formatter-js">sap.ui.define(["sap/ui/core/library"], function (coreLibrary) {
	"use strict";

	const { ValueState } = coreLibrary;

	return {
		/**
		 * Maps shipping status derived from ShippedDate to a ValueState.
		 * @param {Date|string|null} vShippedDate order shipped date
		 * @returns {sap.ui.core.ValueState} semantic state
		 */
		shippingState: function (vShippedDate) {
			if (!vShippedDate) {
				return ValueState.Warning;
			}
			return ValueState.Success;
		},

		/**
		 * Shipping status text key suffix.
		 * @param {Date|string|null} vShippedDate order shipped date
		 * @returns {string} "Shipped" or "Pending"
		 */
		shippingStatusText: function (vShippedDate) {
			return vShippedDate ? "Shipped" : "Pending";
		},

		/**
		 * Line amount = UnitPrice * Quantity * (1 - Discount).
		 * @param {string|number} vUnitPrice unit price
		 * @param {string|number} vQuantity quantity
		 * @param {string|number} vDiscount discount fraction (0..1)
		 * @returns {number} line total
		 */
		lineAmount: function (vUnitPrice, vQuantity, vDiscount) {
			const nPrice = Number(vUnitPrice) || 0;
			const nQty = Number(vQuantity) || 0;
			const nDiscount = Number(vDiscount) || 0;
			return nPrice * nQty * (1 - nDiscount);
		}
	};
});</textarea>

<textarea class="src" id="p-webapp-test-integration-NavigationJourney-js">/* global QUnit */
sap.ui.define(
	[
		"sap/ui/test/opaQunit",
		"sap/ui/test/Opa5",
		"./arrangements/Startup",
		"./pages/Worklist",
		"./pages/Detail"
	],
	function (opaTest, Opa5, Startup) {
		"use strict";

		QUnit.module("Navigation Journey");

		Opa5.extendConfig({
			arrangements: new Startup(),
			viewNamespace: "com.training.orders.view.",
			autoWait: true,
			timeout: 60
		});

		opaTest("Should see the worklist with mocked orders", function (Given, When, Then) {
			Given.iStartMyApp();

			Then.onTheWorklistPage.iShouldSeeTheTitle();
			Then.onTheWorklistPage.iShouldSeeTheTable();

			Then.iTeardownMyApp();
		});

		opaTest("Should navigate from worklist to detail overview and back", function (Given, When, Then) {
			Given.iStartMyApp();

			When.onTheWorklistPage.iPressTheFirstOrder();

			Then.onTheDetailPage.iShouldSeeTheOrderOverview();
			Then.onTheDetailPage.iShouldSeeOrderItems();

			When.onTheDetailPage.iPressTheBackButton();
			Then.onTheWorklistPage.iShouldSeeTheTable();

			Then.iTeardownMyApp();
		});

		opaTest("Should open a specific order via deep link hash", function (Given, When, Then) {
			Given.iStartMyApp({ hash: "Orders/10248" });

			Then.onTheDetailPage.iShouldSeeOrderId("10248");
			Then.onTheDetailPage.iShouldSeeShippingSection();
			Then.onTheDetailPage.iShouldSeeOrderItems();

			Then.iTeardownMyApp();
		});
	}
);</textarea>

<textarea class="src" id="p-webapp-test-integration-pages-Detail-js">sap.ui.define(
	["sap/ui/test/Opa5", "sap/ui/test/actions/Press", "sap/ui/test/matchers/PropertyStrictEquals"],
	function (Opa5, Press, PropertyStrictEquals) {
		"use strict";

		const sViewName = "Detail";

		Opa5.createPageObjects({
			onTheDetailPage: {
				actions: {
					iPressTheBackButton: function () {
						return this.waitFor({
							id: "navBackButton",
							viewName: sViewName,
							actions: new Press(),
							errorMessage: "Back button not found on the detail page"
						});
					}
				},

				assertions: {
					iShouldSeeTheOrderOverview: function () {
						return this.waitFor({
							id: "objectPage",
							viewName: sViewName,
							success: function () {
								Opa5.assert.ok(true, "Detail ObjectPage is displayed");
							},
							errorMessage: "Detail ObjectPage was not found"
						});
					},

					iShouldSeeOrderId: function (sOrderId) {
						return this.waitFor({
							id: "detailTitle",
							viewName: sViewName,
							matchers: function (oTitle) {
								return oTitle.getText().indexOf(String(sOrderId)) !== -1;
							},
							success: function () {
								Opa5.assert.ok(true, "Detail shows order " + sOrderId);
							},
							errorMessage: "Detail title does not contain order " + sOrderId

					iShouldSeeOrderItems: function () {
						return this.waitFor({

	QUnit.test("navTo forwards route, parameters and replace flag", function (assert) {

		assert.ok(this.oRouter.navTo.calledOnce);
		assert.deepEqual(this.oRouter.navTo.firstCall.args, ["detail", { orderId: "10248" }, undefined, true]);

	QUnit.test("onNavBack goes back in the browser history when there is a previous hash", function (assert) {

		assert.ok(this.oRouter.navTo.notCalled, "no router navigation");

		this.oSandbox.stub(History, "getInstance").returns({ getPreviousHash: () =&gt; undefined });

		assert.ok(oGo.notCalled, "browser history untouched");
		assert.deepEqual(this.oRouter.navTo.firstCall.args, ["worklist", {}, undefined, true], "replace navigation to worklist");
	});

		beforeEach: function () {

			this.oController = new BaseController();
			this.oView = { getModel: this.oSandbox.stub(), setModel: this.oSandbox.stub() };

			this.oSandbox.restore();
			this.oController.destroy();

		const oGetBundle = this.oSandbox.stub(this.oController, "getResourceBundle").returns(Promise.resolve(this.oBundle));

		const [oFirst, oSecond] = await Promise.all([
			this.oController._loadResourceBundle(),
			this.oController._loadResourceBundle()
		]);

		assert.strictEqual(oFirst, this.oBundle);
		assert.strictEqual(oSecond, this.oBundle);
		assert.ok(oGetBundle.calledOnce, "bundle requested only once");

		assert.strictEqual(this.oController._getText("worklistTitle"), "text:worklistTitle", "text once loaded");

<textarea class="src" id="p-webapp-test-unit-controller-Worklist-controller-js">/* global QUnit, sinon */
sap.ui.define([
	"com/training/orders/controller/Worklist.controller",
	"sap/ui/model/json/JSONModel",
	"sap/ui/model/FilterOperator",
	"sap/m/MessageToast"
], function (WorklistController, JSONModel, FilterOperator, MessageToast) {
	"use strict";

	/**
	 * Shared arrangement: a controller without a real view.
	 * The table, its binding, the router and i18n are replaced by stubs.
	 */
	function arrange(oContext) {
		oContext.oSandbox = sinon.createSandbox();
		oContext.oController = new WorklistController();

		oContext.oBinding = {
			filter: oContext.oSandbox.stub(),
			sort: oContext.oSandbox.stub(),
			refresh: oContext.oSandbox.stub()
		};
		oContext.oTable = { getBinding: oContext.oSandbox.stub().withArgs("items").returns(oContext.oBinding) };
		oContext.oViewModel = new JSONModel({ count: 0, countFiltered: 0 });

		oContext.oSandbox.stub(oContext.oController, "byId").withArgs("ordersTable").returns(oContext.oTable);
		oContext.oSandbox.stub(oContext.oController, "getModel").withArgs("worklistView").returns(oContext.oViewModel);
		oContext.oSandbox.stub(oContext.oController, "navTo");
		oContext.oSandbox.stub(oContext.oController, "_loadResourceBundle")
			.resolves({ getText: (sKey) =&gt; sKey });
		oContext.oToast = oContext.oSandbox.stub(MessageToast, "show");
	}

	function cleanUp(oContext) {
		oContext.oSandbox.restore();
		oContext.oViewModel.destroy();
		oContext.oController.destroy();
	}

	/* ── onInit ── */
	QUnit.module("Worklist.controller – onInit", {
		beforeEach: function () {
			this.oSandbox = sinon.createSandbox();
			this.oController = new WorklistController();
			this.oAttach = this.oSandbox.stub();
			this.oSetModel = this.oSandbox.stub(this.oController, "setModel");
			this.oSandbox.stub(this.oController, "getRouter").returns({
				getRoute: (sName) =&gt; (sName === "worklist" ? { attachPatternMatched: this.oAttach } : null)
			});
		},
		afterEach: function () {
			this.oSandbox.restore();
			this.oController.destroy();
		}
	});

	QUnit.test("creates the worklistView model and listens to the worklist route", function (assert) {
		this.oController.onInit();

		const [oModel, sName] = this.oSetModel.firstCall.args;
		assert.strictEqual(sName, "worklistView");
		assert.strictEqual(oModel.getProperty("/busy"), false);
		assert.ok(this.oAttach.calledWith(this.oController._onRouteMatched, this.oController), "pattern-matched handler bound to the controller");
		oModel.destroy();
	});

	/* ── onSearch (debounce) ── */
	QUnit.module("Worklist.controller – search debounce", {
		beforeEach: function () {
			this.oSandbox = sinon.createSandbox();
			this.oController = new WorklistController();
			this.oApply = this.oSandbox.stub(this.oController, "_applySearch");
			this.oClock = this.oSandbox.useFakeTimers();
			this.fnEvent = (mParams) =&gt; ({ getParameter: (sName) =&gt; mParams[sName] });
		},
		afterEach: function () {
			this.oSandbox.restore();
			this.oController.destroy();
		}
	});

	QUnit.test("searches only after 300 ms of silence", function (assert) {
		this.oController.onSearch(this.fnEvent({ newValue: "Vin" }));
		this.oController.onSearch(this.fnEvent({ newValue: "VINET" }));
		this.oClock.tick(299);
		assert.ok(this.oApply.notCalled, "nothing before 300 ms");

		this.oClock.tick(1);
		assert.ok(this.oApply.calledOnce, "exactly one search");
		assert.ok(this.oApply.calledWith("VINET"), "with the last value");
	});

	QUnit.test("uses the query parameter of the search event", function (assert) {
		this.oController.onSearch(this.fnEvent({ query: "Reims" }));
		this.oClock.tick(300);

		assert.ok(this.oApply.calledWith("Reims"));
	});

	QUnit.test("searches for an empty string when the field is cleared", function (assert) {
		this.oController.onSearch(this.fnEvent({}));
		this.oClock.tick(300);

		assert.ok(this.oApply.calledWith(""));
	});

	/* ── _applySearch ── */
	QUnit.module("Worklist.controller – _applySearch", {
		beforeEach: function () {
			arrange(this);
		},
		afterEach: function () {
			cleanUp(this);
		}
	});

	QUnit.test("filters text fields with Contains, combined with OR", function (assert) {
		this.oController._applySearch("  Reims ");

		const [aFilters] = this.oBinding.filter.firstCall.args;
		assert.strictEqual(aFilters.length, 1, "one OR group");
		const oGroup = aFilters[0];
		assert.strictEqual(oGroup.isAnd(), false, "fields combined with OR");
		const aInner = oGroup.getFilters();
		assert.deepEqual(aInner.map((o) =&gt; o.getPath()), ["CustomerID", "ShipName", "ShipCity", "ShipCountry"]);
		assert.ok(aInner.every((o) =&gt; o.getOperator() === FilterOperator.Contains &amp;&amp; o.getValue1() === "Reims"), "Contains + trimmed value");
	});

	QUnit.test("adds an OrderID equality filter for numeric input", function (assert) {
		this.oController._applySearch("10248");

		const oFirst = this.oBinding.filter.firstCall.args[0][0].getFilters()[0];
		assert.strictEqual(oFirst.getPath(), "OrderID");
		assert.strictEqual(oFirst.getOperator(), FilterOperator.EQ);
		assert.strictEqual(oFirst.getValue1(), 10248, "compared as a number");
	});

	QUnit.test("clears the filter for an empty or blank query", function (assert) {
		this.oController._applySearch("   ");

		assert.deepEqual(this.oBinding.filter.firstCall.args[0], []);
	});

	QUnit.test("does not fail before the table exists", function (assert) {
		this.oController.byId.withArgs("ordersTable").returns(undefined);

		this.oController._applySearch("VINET");

		assert.ok(this.oBinding.filter.notCalled, "nothing to filter yet");
	});

	QUnit.test("re-applies the stored filter when the route matches again", function (assert) {
		this.oController._applySearch("VINET");
		this.oController._onRouteMatched();

		assert.strictEqual(this.oBinding.filter.callCount, 2);
		assert.strictEqual(this.oBinding.filter.secondCall.args[0], this.oBinding.filter.firstCall.args[0], "same filter kept");
	});

	/* ── sort, refresh, navigation, counter ── */
	QUnit.module("Worklist.controller – table actions", {
		beforeEach: function () {
			arrange(this);
		},
		afterEach: function () {
			cleanUp(this);
		}
	});

	QUnit.test("onSort toggles between descending and ascending OrderID", function (assert) {
		this.oController.onSort();
		this.oController.onSort();

		const [oFirst, oSecond] = this.oBinding.sort.getCalls().map((c) =&gt; c.args[0]);
		assert.strictEqual(oFirst.sPath, "OrderID");
		assert.strictEqual(oFirst.bDescending, true, "first press: descending");
		assert.strictEqual(oSecond.bDescending, false, "second press: ascending");
	});

	QUnit.test("onSort does nothing when the table has no binding", function (assert) {
		this.oTable.getBinding.withArgs("items").returns(undefined);

		this.oController.onSort();

		assert.ok(this.oBinding.sort.notCalled, "nothing sorted");
		assert.strictEqual(this.oController._bSortDescending, undefined, "sort state unchanged");
	});

	QUnit.test("onRefresh reloads the list and confirms with a toast", async function (assert) {
		await this.oController.onRefresh();

		assert.ok(this.oBinding.refresh.calledOnce, "binding refreshed");
		assert.strictEqual(this.oToast.firstCall.args[0], "worklistRefreshed", "i18n key shown");
	});

	QUnit.test("onRefresh does nothing when the table has no binding", async function (assert) {
		this.oTable.getBinding.withArgs("items").returns(undefined);

		await this.oController.onRefresh();

		assert.ok(this.oToast.notCalled);
	});

	QUnit.test("onPressOrder navigates to the detail of the pressed order", function (assert) {
		const oEvent = {
			getSource: () =&gt; ({ getBindingContext: () =&gt; ({ getProperty: (sPath) =&gt; (sPath === "OrderID" ? 10248 : null) }) })
		};

		this.oController.onPressOrder(oEvent);

		assert.deepEqual(this.oController.navTo.firstCall.args, ["detail", { orderId: "10248" }], "orderId passed as string");
	});

	QUnit.test("onUpdateFinished writes the total to the view model", function (assert) {
		this.oController.onUpdateFinished({ getParameter: (sName) =&gt; (sName === "total" ? 830 : undefined) });

		assert.strictEqual(this.oViewModel.getProperty("/count"), 830);
		assert.strictEqual(this.oViewModel.getProperty("/countFiltered"), 830);
	});
});</textarea>
<textarea class="src" id="p-webapp-test-unit-model-formatter-js">/* global QUnit */
sap.ui.define([
	"com/training/orders/model/formatter",
	"sap/ui/core/library"
], function (formatter, coreLibrary) {
	"use strict";

	const { ValueState } = coreLibrary;

	// The OData V2 model delivers Edm.DateTime values as JavaScript Date objects
	const oShippedDate = new Date(Date.UTC(1996, 6, 16));

	/**
	 * Data-driven tests: one QUnit test per row.
	 * QUnit.test.each needs QUnit 2.16+, but UI5 bundles QUnit 2.3.2, so we loop instead.
	 * @param {string} sTitle test title prefix
	 * @param {Array&lt;Array&gt;} aCases rows of arguments
	 * @param {function} fnTest test body receiving (assert, row)
	 */
	function testEach(sTitle, aCases, fnTest) {
		aCases.forEach(function (aCase) {
			QUnit.test(sTitle + " " + JSON.stringify(aCase), function (assert) {
				fnTest(assert, aCase);
			});
		});
	}

	QUnit.module("formatter.shippingState");

	QUnit.test("maps a shipped order to Success", function (assert) {
		// Act
		const sState = formatter.shippingState(oShippedDate);

		// Assert
		assert.strictEqual(sState, ValueState.Success, "a shipped date means Success");
	});

	testEach("maps a missing shipped date to Warning", [
		[null],
		[undefined],
		[""]
	], function (assert, [vShippedDate]) {
		assert.strictEqual(formatter.shippingState(vShippedDate), ValueState.Warning);
	});

	QUnit.module("formatter.shippingStatusText");

	QUnit.test("returns Shipped when a date exists", function (assert) {
		assert.strictEqual(formatter.shippingStatusText(oShippedDate), "Shipped");
	});

	testEach("returns Pending when there is no date", [
		[null],
		[undefined],
		[""]
	], function (assert, [vShippedDate]) {
		assert.strictEqual(formatter.shippingStatusText(vShippedDate), "Pending");
	});

	QUnit.module("formatter.lineAmount");

	testEach("calculates UnitPrice * Quantity * (1 - Discount)", [
		// UnitPrice (Edm.Decimal arrives as string), Quantity, Discount, expected
		["10.0000", 3, 0.1, 27],
		["14.0000", 12, 0, 168],
		["9.8000", 10, 0, 98],
		["34.8000", 5, 1, 0]
	], function (assert, [vPrice, vQuantity, vDiscount, nExpected]) {
		assert.strictEqual(formatter.lineAmount(vPrice, vQuantity, vDiscount), nExpected);
	});

	testEach("treats missing or invalid input as zero", [
		[undefined, 2, 0, 0],
		["5", undefined, 0, 0],
		["5", 2, undefined, 10],
		["abc", 2, 0, 0]
	], function (assert, [vPrice, vQuantity, vDiscount, nExpected]) {
		assert.strictEqual(formatter.lineAmount(vPrice, vQuantity, vDiscount), nExpected);
	});
});</textarea>

sap.ui.define([
	"com/training/orders/model/models",
	"sap/ui/model/BindingMode"
], function (models, BindingMode) {
	"use strict";

	QUnit.module("models.createViewModel", {
		afterEach: function () {
			if (this.oModel) {
				this.oModel.destroy();
			}
		}
	});

	QUnit.test("creates the default view state", function (assert) {
		this.oModel = models.createViewModel();

		assert.deepEqual(this.oModel.getData(), {
			busy: false,
			delay: 0,
			tableBusyDelay: 0,
			count: 0,
			countFiltered: 0
		});
	});

	QUnit.test("merges custom values over the defaults", function (assert) {
		this.oModel = models.createViewModel({ busy: true, extra: "x" });

		assert.strictEqual(this.oModel.getProperty("/busy"), true, "busy overridden");
		assert.strictEqual(this.oModel.getProperty("/count"), 0, "defaults kept");
		assert.strictEqual(this.oModel.getProperty("/extra"), "x", "extra property added");
	});

	QUnit.test("returns independent instances", function (assert) {
		const oFirst = models.createViewModel();
		const oSecond = models.createViewModel();

		oFirst.setProperty("/busy", true);

		assert.strictEqual(oSecond.getProperty("/busy"), false, "no shared state between views");
		oFirst.destroy();
		oSecond.destroy();
	});

	QUnit.module("models.createDeviceModel");

	QUnit.test("is a one-way model", function (assert) {
		const oModel = models.createDeviceModel();

		assert.strictEqual(oModel.getDefaultBindingMode(), BindingMode.OneWay);
		assert.strictEqual(typeof oModel.getProperty("/system/phone"), "boolean", "exposes sap/ui/Device data");
		oModel.destroy();
	});
});</textarea>

<textarea class="src" id="p-webapp-view-Worklist-view-xml">&lt;mvc:View

	xmlns="sap.m"

						&lt;/cells&gt;
					&lt;/ColumnListItem&gt;

<textarea class="src" id="x-debounce">// webapp/test/unit/controller/Worklist.controller.js (excerpt)
	/* ── onSearch (debounce) ── */
	QUnit.module("Worklist.controller – search debounce", {
		beforeEach: function () {
			this.oSandbox = sinon.createSandbox();
			this.oController = new WorklistController();
			this.oApply = this.oSandbox.stub(this.oController, "_applySearch");
			this.oClock = this.oSandbox.useFakeTimers();
			this.fnEvent = (mParams) =&gt; ({ getParameter: (sName) =&gt; mParams[sName] });
		},
		afterEach: function () {
			this.oSandbox.restore();
			this.oController.destroy();
		}
	});

	QUnit.test("searches only after 300 ms of silence", function (assert) {
		this.oController.onSearch(this.fnEvent({ newValue: "Vin" }));
		this.oController.onSearch(this.fnEvent({ newValue: "VINET" }));
		this.oClock.tick(299);
		assert.ok(this.oApply.notCalled, "nothing before 300 ms");

		this.oClock.tick(1);
		assert.ok(this.oApply.calledOnce, "exactly one search");
		assert.ok(this.oApply.calledWith("VINET"), "with the last value");
	});

	QUnit.test("uses the query parameter of the search event", function (assert) {
		this.oController.onSearch(this.fnEvent({ query: "Reims" }));
		this.oClock.tick(300);

		assert.ok(this.oApply.calledWith("Reims"));
	});

	QUnit.test("searches for an empty string when the field is cleared", function (assert) {
		this.oController.onSearch(this.fnEvent({}));
		this.oClock.tick(300);

		assert.ok(this.oApply.calledWith(""));
	});</textarea>
<textarea class="src" id="x-onsearch">// webapp/controller/Worklist.controller.js (excerpt)
	/**
	 * Live search with 300 ms debounce (exercises Sinon fake timers in unit tests).
	 * @param {sap.ui.base.Event} oEvent search field event
	 */
	onSearch: function (oEvent) {
		const sQuery = oEvent.getParameter("query") || oEvent.getParameter("newValue") || "";
		clearTimeout(this._iSearchTimer);
		this._iSearchTimer = setTimeout(() =&gt; {
			this._applySearch(sQuery);
		}, 300);
	},</textarea>

  "ch1.n": {pt:"Capítulo I", en:"Chapter I", fr:"Chapitre I"},
  "ch1.t": {pt:"Porquê testar ao nível da unidade", en:"Why test at unit level", fr:"Pourquoi tester au niveau unitaire"},
  "ch1.body": {
    pt:"<p>Um teste unitário verifica <strong>uma unidade de lógica isolada</strong>: um formatter, um tipo, um utilitário, o método de um controller. Corre em milissegundos, no browser, sem backend e sem renderizar a aplicação inteira.</p><p>Na pirâmide de testes que a SAP recomenda, os testes unitários são a base larga: muitos, rápidos e baratos. Por cima ficam os testes de integração com <strong>OPA5</strong>, que percorrem a aplicação com dados simulados, e no topo poucos testes end-to-end contra um sistema real.</p><p>A regra prática: se a lógica pode ser chamada como uma função e verificada pelo resultado, pertence aqui. Se depende de navegação, de vários ecrãs ou do comportamento real de controlos, pertence ao OPA5.</p>",
    en:"<p>A unit test checks <strong>one isolated unit of logic</strong>: a formatter, a type, a utility, a controller method. It runs in milliseconds, in the browser, with no backend and without rendering the whole app.</p><p>In the test pyramid SAP recommends, unit tests are the broad base: many, fast and cheap. Above them sit integration tests with <strong>OPA5</strong>, which walk through the app with mock data, and at the top a few end-to-end tests against a real system.</p><p>The rule of thumb: if the logic can be called like a function and checked by its result, it belongs here. If it depends on navigation, several screens or real control behaviour, it belongs in OPA5.</p>",
    fr:"<p>Un test unitaire vérifie <strong>une unité de logique isolée</strong> : un formatter, un type, un utilitaire, une méthode de contrôleur. Il s’exécute en quelques millisecondes, dans le navigateur, sans backend et sans afficher toute l’application.</p><p>Dans la pyramide de tests recommandée par SAP, les tests unitaires forment la large base : nombreux, rapides et peu coûteux. Au-dessus viennent les tests d’intégration <strong>OPA5</strong>, qui parcourent l’application avec des données simulées, et au sommet quelques tests de bout en bout sur un système réel.</p><p>La règle pratique : si la logique peut être appelée comme une fonction et vérifiée par son résultat, elle a sa place ici. Si elle dépend de la navigation, de plusieurs écrans ou du comportement réel des contrôles, elle relève d’OPA5.</p>"},

  "ch2.n": {pt:"Capítulo II", en:"Chapter II", fr:"Chapitre II"},
  "ch2.t": {pt:"Conceitos fundamentais", en:"Core concepts", fr:"Concepts fondamentaux"},
  "ch2.lede": {pt:"O vocabulário de QUnit e Sinon que vai encontrar em todos os testes.", en:"The QUnit and Sinon vocabulary you will meet in every test.", fr:"Le vocabulaire QUnit et Sinon que vous retrouverez dans chaque test."},

  "ch3.n": {pt:"Capítulo III", en:"Chapter III", fr:"Chapitre III"},
  "ch3.t": {pt:"Anatomia de um projeto testado", en:"Anatomy of a tested project", fr:"Anatomie d’un projet testé"},
  "ch3.lede": {pt:"Os ficheiros do Northwind Orders que entram nos testes: o código testado, os dados simulados, os testes e a sua configuração, pela ordem do explorador do BAS. Selecione um ficheiro para ver o seu papel, o conteúdo e o passo em que é criado; os restantes ficheiros estão no passo a passo.", en:"The Northwind Orders files that take part in the tests: the code under test, the mock data, the tests and their configuration, in BAS explorer order. Select a file to see its role, its content and the step that creates it; the remaining files are in the step-by-step chapter.", fr:"Les fichiers de Northwind Orders qui interviennent dans les tests : le code testé, les données simulées, les tests et leur configuration, dans l’ordre de l’explorateur BAS. Sélectionnez un fichier pour voir son rôle, son contenu et l’étape qui le crée ; les autres fichiers se trouvent dans le pas à pas."},

  "ch4.n": {pt:"Capítulo IV", en:"Chapter IV", fr:"Chapitre IV"},
  "ch4.t": {pt:"Implementação passo a passo", en:"Step-by-step implementation", fr:"Mise en œuvre pas à pas"},
  "ch4.lede": {pt:"Dezanove etapas para reproduzir no BAS, ficheiro a ficheiro, o projeto Northwind Orders (<code>com.training.orders</code>) e os seus 54 testes. Todo o código abaixo é o do projeto.", en:"Nineteen steps to rebuild in BAS, file by file, the Northwind Orders project (<code>com.training.orders</code>) and its 54 tests. All code below is the project’s own.", fr:"Dix-neuf étapes pour reconstruire dans BAS, fichier par fichier, le projet Northwind Orders (<code>com.training.orders</code>) et ses 54 tests. Tout le code ci-dessous est celui du projet."},

   why:{pt:"Desfazer tudo de uma vez com <code>restore()</code> no <code>afterEach</code>. Sem isto, um stub esquecido passa para o teste seguinte e causa falhas difíceis de explicar.", en:"To undo everything at once with <code>restore()</code> in <code>afterEach</code>. Without it, a forgotten stub leaks into the next test and causes failures that are hard to explain.", fr:"Tout annuler d’un coup avec <code>restore()</code> dans <code>afterEach</code>. Sans cela, un stub oublié fuit vers le test suivant et provoque des échecs difficiles à expliquer."},
